<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>014 C — „Hangar“</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Rajdhani:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   014 C — „HANGAR“
   Die radikalste der drei. Es gibt keine Spalten mehr, kein Panel,
   keine Liste — es gibt EINEN RAUM, und man steht darin.

   Die Werte sind keine Tabellenzeilen und keine Karten: sie haengen
   als Beschriftungen IM Raum, an den Stellen, zu denen sie gehoeren,
   mit Fuehrungslinien zum Rumpf. Wer etwas wissen will, sieht hin.

   Die Systemwahl ist keine Navigation mehr, sondern eine BLENDE am
   unteren Rand — sie schaltet um, WAS beschriftet ist, so wie ein
   Helmvisier Ebenen einblendet. Sie fuehrt nirgendwohin.

   Warum das die teuerste Variante ist: sie gibt die Spaltenstruktur
   auf, an der heute Rail, Auslesung UND das gesamte No-JS-Verhalten
   (D-02) haengen. Ohne JavaScript muesste eine gleichwertige Liste
   darunter stehen — sonst faellt der Zulauf aus der Suche weg, und
   der ist bei ~17.000 indexierbaren Seiten die Existenzgrundlage.

   ⚠ Attrappe: Beschriftungspositionen geschaetzt. In Produktion
   folgen sie den echten Portpositionen des Meshes.
   ============================================================ */
:root{
  --grund:#04060b; --text:#eaf2fb; --fliess:#93a2b5;
  --leise:#5b6675; --an:#5ad2ff; --warm:#e8b45c;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:"Rajdhani",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--grund);color:var(--fliess);
  font:400 15px/1.6 "Barlow",system-ui,sans-serif;overflow:hidden}

.raum{position:relative;height:100vh;width:100vw;overflow:hidden}

/* Boden + Licht */
.raum::before{content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 46% at 50% 58%,rgba(70,140,200,.22),transparent 68%),
    radial-gradient(ellipse 120% 70% at 50% 120%,rgba(90,210,255,.10),transparent 60%),
    var(--grund)}
.boden{position:absolute;left:-10%;right:-10%;bottom:0;height:42%;z-index:1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(90,210,255,.10) 0 1px,transparent 1px 84px),
    repeating-linear-gradient(0deg,rgba(90,210,255,.09) 0 1px,transparent 1px 46px);
  transform:perspective(560px) rotateX(72deg);transform-origin:bottom;
  mask-image:linear-gradient(180deg,transparent,#000 42%,#000 82%,transparent)}

/* Das Schiff */
.schiff{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:2;
  width:70%;max-width:900px}
.schiff img{width:100%;display:block;filter:saturate(.78) contrast(1.08) brightness(1.02);
  -webkit-mask-image:radial-gradient(ellipse 78% 78% at 50% 50%,#000 60%,transparent);
  mask-image:radial-gradient(ellipse 78% 78% at 50% 50%,#000 60%,transparent)}

/* Beschriftungen im Raum */
.note{position:absolute;z-index:4}
.note .k{font:500 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--leise)}
.note .w{font:700 24px/1.05 var(--ui);color:var(--text);margin-top:2px}
.note .w em{font-style:normal;font-size:13px;color:var(--fliess);margin-left:5px}
.note.an .w{color:var(--an)}
.note.gold .w{color:var(--warm)}
.note::before{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--an);
  transform:rotate(45deg)}
.note.l::before{left:-22px;top:9px}
.note.r::before{right:-22px;top:9px}
.linie{position:absolute;z-index:3;height:1px;
  background:linear-gradient(90deg,rgba(90,210,255,.55),rgba(90,210,255,.06));pointer-events:none}
.linie.r{background:linear-gradient(270deg,rgba(90,210,255,.55),rgba(90,210,255,.06))}

/* HUD-Ecken, wie ein Visier */
.visier{position:absolute;inset:26px;z-index:6;pointer-events:none}
.visier i{position:absolute;width:26px;height:26px;border:1px solid rgba(90,210,255,.4)}
.visier i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.visier i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.visier i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.visier i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

/* Kopfzeile: Name links oben, klein */
.kopf{position:absolute;left:52px;top:50px;z-index:6}
.kopf .marke{font:500 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--leise)}
.kopf h1{font:700 34px/1 var(--ui);color:var(--text);margin-top:5px}
.kopf .zurueck{display:inline-block;margin-top:11px;font:600 10px var(--ui);letter-spacing:.18em;
  text-transform:uppercase;color:var(--leise);border-bottom:1px solid rgba(110,168,255,.25);padding-bottom:2px}

/* Blende unten: schaltet EBENEN, keine Seiten */
.blende{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:7;
  display:flex;align-items:center;gap:0;background:rgba(6,10,17,.78);backdrop-filter:blur(9px);
  border:1px solid rgba(110,168,255,.2)}
.blende button{background:none;border:0;border-left:1px solid rgba(110,168,255,.14);
  padding:11px 17px;cursor:pointer;color:var(--leise);
  font:700 10.5px var(--ui);letter-spacing:.15em;text-transform:uppercase}
.blende button:first-child{border-left:0}
.blende button.an{color:var(--text);background:rgba(90,210,255,.10);box-shadow:inset 0 -2px 0 var(--an)}
.blende .z{font-family:var(--mono);font-size:9.5px;margin-left:6px;color:var(--leise)}
.blende button.an .z{color:var(--an)}

/* Hinweis auf die Liste darunter (D-02 bleibt Pflicht) */
/* Ueber der Blende, nicht daneben — bei 1280px lief sie sonst in die
   Knopfreihe hinein (Sichtbefund am ersten Schuss). */
.fuss{position:absolute;right:52px;bottom:108px;z-index:6;text-align:right}
.fuss .t{font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--leise)}
.fuss .p{font:700 15px var(--ui);color:var(--fliess);margin-top:2px}
</style>
</head>
<body>

<div class="raum">
  <div class="boden"></div>

  <div class="schiff">
    <img src="https://media.starcitizen.tools/thumb/9/92/Carrack_over_microTech_3.8.png/1280px-Carrack_over_microTech_3.8.png.webp" alt="Anvil Carrack im Hangar">
  </div>

  <!-- Beschriftungen haengen im Raum, mit Fuehrungslinie zum Rumpf -->
  <div class="linie" style="left:19%;top:31%;width:9%"></div>
  <div class="note l an" style="left:9%;top:29%"><div class="k">Schildgeneratoren</div><div class="w">Barbican <em>×2</em></div></div>

  <div class="linie" style="left:17%;top:52%;width:11%"></div>
  <div class="note l" style="left:7%;top:50%"><div class="k">Generatoren</div><div class="w">Reliance <em>×2</em></div></div>

  <div class="linie" style="left:14%;top:71%;width:13%"></div>
  <div class="note l" style="left:5%;top:69%"><div class="k">Länge über alles</div><div class="w">126 <em>m</em></div></div>

  <div class="linie r" style="right:18%;top:27%;width:10%"></div>
  <div class="note r" style="right:6%;top:25%"><div class="k">Quantum-Antrieb</div><div class="w">Kama</div></div>

  <div class="linie r" style="right:16%;top:47%;width:12%"></div>
  <div class="note r" style="right:5%;top:45%"><div class="k">Frachtraum</div><div class="w">456 <em>SCU</em></div></div>

  <div class="linie r" style="right:19%;top:67%;width:9%"></div>
  <div class="note r gold" style="right:6%;top:65%"><div class="k">Im Verse ab</div><div class="w">34.398.000 <em>aUEC</em></div></div>

  <div class="kopf">
    <div class="marke">Anvil Aerospace</div>
    <h1>Carrack</h1>
    <div class="zurueck">&larr; Schiffe</div>
  </div>

  <div class="blende">
    <button class="an">Komponenten<span class="z">8</span></button>
    <button>Bewaffnung<span class="z">4</span></button>
    <button>Antrieb<span class="z">10</span></button>
    <button>Sonstiges<span class="z">5</span></button>
    <button>Ausstattung<span class="z">3</span></button>
    <button>Kaufen<span class="z">1</span></button>
    <button>Leistung<span class="z">6</span></button>
    <button>Umfeld<span class="z">3</span></button>
  </div>

  <div class="fuss">
    <div class="t">Ohne Skript · für Suchmaschinen</div>
    <div class="p">Vollständige Liste darunter &darr;</div>
  </div>

  <div class="visier"><i></i><i></i><i></i><i></i></div>
</div>

</body>
</html>
