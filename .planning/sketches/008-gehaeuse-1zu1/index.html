<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Skizze 008 — Gehäuse 1:1</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
* { box-sizing: border-box; }
body { margin:0; background:#0a0d0e; color:var(--text); font-family:var(--font-ui); padding-top:44px; }
.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

#variant-nav { position:fixed; top:0; left:0; right:0; z-index:9998; background:#11181b;
  border-bottom:1px solid var(--line); padding:7px 14px; display:flex; gap:8px; align-items:center; }
#variant-nav .ttl { font-size:12px; color:var(--muted); margin-right:8px; letter-spacing:.04em;
  text-transform:uppercase; }
.variant-tab { font:inherit; font-size:12px; padding:5px 12px; border:0; cursor:pointer;
  border-radius:7px; background:#1e2629; color:var(--muted); transition:all var(--dur-fast) var(--ease-ui); }
.variant-tab:hover { background:#283437; color:var(--text); }
.variant-tab.active { background:var(--accent-2); color:var(--ink); font-weight:600; }
.variant { display:none; } .variant.active { display:block; }

.stage { margin:16px auto; width:1280px; max-width:calc(100vw - 32px); }
.stage__cap { display:flex; align-items:baseline; gap:12px; padding:0 2px 8px; font-size:12px;
  color:var(--muted); }
.stage__cap b { color:var(--text); font-size:13px; }
.stage__vp { position:relative; overflow:hidden; height:720px; background:#0a0d0e; }
.fold { position:absolute; left:0; right:0; top:720px; border-top:1px dashed rgba(224,165,38,.55);
  z-index:60; }

/* ══════════════════════════════════════════════════════════════════
   DAS GEHÄUSE — Bild 2, ohne Abschwächung.
   Kein backdrop-filter mehr irgendwo darin: hinter einem deckenden
   Metallgehäuse hat Glas nichts zu spiegeln. Damit ist auch die
   clip-path-über-backdrop-filter-Falle (840 ms Menü-Eintritt) baulich
   ausgeschlossen — der Silhouettenschnitt unten ist dadurch gefahrlos.
   ══════════════════════════════════════════════════════════════════ */
.rig { position:relative;
  /* Maße des Gehäuses — die einzige Stellschraube zwischen den Varianten */
  --side: 64px;   /* Breite der Seitenholme        */
  --top: 104px;   /* Höhe des Kopfbandes           */
  --bot: 62px;    /* Höhe des Sockels              */
  --chamf: 30px;  /* Eckabschnitt der Silhouette   */
  padding:var(--top) var(--side) var(--bot);
  clip-path:polygon(
    var(--chamf) 0, calc(100% - var(--chamf)) 0,
    100% var(--chamf), 100% calc(100% - var(--chamf)),
    calc(100% - var(--chamf)) 100%, var(--chamf) 100%,
    0 calc(100% - var(--chamf)), 0 var(--chamf));
  /* ⚠ Erste Fassung fiel zu schnell ins Dunkle ab und las sich als schwarzer
     Rand statt als Blech: das Gehäuse MUSS heller sein als die Bildfläche,
     sonst verschwindet der Rahmen genau da, wo er wirken soll. */
  background:
    /* feine waagerechte Bandierung des gebürsteten Metalls */
    repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 5px),
    /* Lichtsichel von links oben — gibt der Fläche eine Wölbung */
    radial-gradient(150% 110% at 18% -10%, rgba(232,241,240,.14) 0%, transparent 46%),
    linear-gradient(180deg, #55625f 0%, #46514f 8%, #39433f 30%, #2e3739 64%, #232b2d 100%); }
/* Lichtkante oben, Schattenkante unten — macht aus der Fläche ein Blech */
/* ⚠ z-index 8 liegt ÜBER Kopfband, Holmen und Sockel — der Innenschatten hat
   sie mitgedunkelt und die Materialarbeit dort wieder zunichte gemacht.
   Deshalb nur noch die Kanten zeichnen, nicht mehr flächig abdunkeln. */
.rig::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:8;
  box-shadow: inset 0 2px 0 rgba(232,241,240,.28), inset 0 -2px 0 rgba(0,0,0,.7); }

/* ---------- Kopfband: zwei geriffelte Schulterplatten + Kartusche ---------- */
.rig__head { position:absolute; left:0; right:0; top:0; height:var(--top);
  display:flex; align-items:stretch; z-index:4; }
.rig__sh { position:relative; flex:1;
  background:
    /* heller Lichtstreifen quer über die Schulter — im Mockup das auffälligste
       Materialmerkmal des Kopfbandes */
    linear-gradient(180deg, transparent 40%, rgba(232,241,240,.13) 46% 52%, transparent 58%),
    linear-gradient(180deg, #5c6866 0%, #4a5452 30%, #38423f 66%, #2a3234 100%);
  box-shadow: inset 0 2px 0 rgba(232,241,240,.30), inset 0 -2px 6px rgba(0,0,0,.5); }
/* Die Schulter fällt zur Kartusche hin schräg ab */
.rig__sh--l { clip-path:polygon(0 0, 100% 0, 100% 46%, calc(100% - 46px) 100%, 0 100%); }
.rig__sh--r { clip-path:polygon(0 0, 100% 0, 100% 100%, 46px 100%, 0 46%); }
/* Riffelung — die feinen senkrechten Striche aus dem Mockup */
.rig__sh::after { content:''; position:absolute; left:24px; right:24px; top:14px; height:30px;
  background:repeating-linear-gradient(90deg,
    rgba(232,241,240,.22) 0 1px, rgba(0,0,0,.18) 1px 2px, transparent 2px 5px);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.rig__sh--r::after { left:60px; }

/* versenkte Titel-Kartusche in der Mitte */
.rig__cart { position:relative; flex:0 0 auto; min-width:520px; display:flex;
  align-items:center; justify-content:center; gap:18px; padding:0 46px 6px;
  background:linear-gradient(180deg, #0b0f10 0%, #10171a 70%, #0c1113 100%);
  clip-path:polygon(38px 0, calc(100% - 38px) 0, 100% 100%, 0 100%);
  box-shadow: inset 0 4px 12px rgba(0,0,0,.9), inset 0 -2px 0 rgba(53,214,255,.28); }
.rig__cart h1 { margin:0; font-size:30px; font-weight:600; letter-spacing:-.01em; line-height:1;
  color:var(--text); }
.rig__cart .ver { font:600 11px var(--font-mono); letter-spacing:.14em; color:var(--accent-2);
  white-space:nowrap; text-transform:uppercase; }

/* ---------- Seitenholme mit Leuchtsegmenten in Nuten ---------- */
.rig__side { position:absolute; top:var(--top); bottom:var(--bot); width:var(--side); z-index:5;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  /* Eigene Blechfläche: ohne sie zeigte der Holm den Grundverlauf und war an
     dieser Höhe fast schwarz — der Holm verschwand, nur die Lampe blieb. */
  background:linear-gradient(90deg, #4b5654 0%, #3a4442 46%, #2c3436 100%); }
.rig__side--r { background:linear-gradient(270deg, #4b5654 0%, #3a4442 46%, #2c3436 100%); }
.rig__side--l { left:0; } .rig__side--r { right:0; }
/* die eingefräste Nut */
/* ⚠ Die Nut war 38 von 64 px breit und fraß den Holm auf — sichtbar blieb ein
   dunkler Kanal statt eines Blechs mit Fräsung. Jetzt 24 px. */
.rig__side::before { content:''; position:absolute; top:18px; bottom:18px;
  left:50%; transform:translateX(-50%); width:calc(var(--side) - 40px);
  background:linear-gradient(90deg, #0d1112, #151b1d 42%, #0e1314);
  box-shadow: inset 0 0 0 1px rgba(232,241,240,.10), inset 0 3px 8px rgba(0,0,0,.7); }
/* zwei kurze Leuchtsegmente je Seite — genau wie im Mockup, nicht durchgehend */
.rig__lamp { position:relative; z-index:2; width:10px; height:104px; border-radius:5px;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--hull-lamp) 55%, transparent),
    var(--hull-lamp) 22%, var(--hull-lamp) 78%,
    color-mix(in srgb, var(--hull-lamp) 55%, transparent));
  box-shadow: 0 0 18px rgba(53,214,255,.75), 0 0 44px rgba(53,214,255,.28); }

/* ---------- Sockel: Lüftungsgitter, Bolzen, Kennstreifen ---------- */
.rig__base { position:absolute; left:0; right:0; bottom:0; height:var(--bot); z-index:4;
  display:flex; align-items:center; justify-content:space-between; padding:0 22px;
  background:
    linear-gradient(180deg, transparent 52%, rgba(232,241,240,.10) 56% 62%, transparent 68%),
    linear-gradient(180deg, #3c4644 0%, #4a5452 26%, #333c3e 72%, #232a2c 100%);
  box-shadow: inset 0 2px 0 rgba(232,241,240,.22), inset 0 -2px 8px rgba(0,0,0,.6); }
.rig__vent { width:150px; height:22px;
  background:repeating-linear-gradient(90deg,
    rgba(0,0,0,.62) 0 3px, rgba(232,241,240,.10) 3px 6px);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
.rig__mark { font:600 10px var(--font-mono); letter-spacing:.28em; text-transform:uppercase;
  color:color-mix(in srgb, var(--muted) 70%, transparent); }
.rig__bolt { position:absolute; width:14px; height:14px; border-radius:50%; z-index:7;
  background:radial-gradient(circle at 34% 28%, #55605f, #12181a 72%);
  box-shadow:0 1px 3px rgba(0,0,0,.85), inset 0 0 0 1px rgba(232,241,240,.16); }

/* Statusdioden oben rechts */
.rig__dots { position:absolute; right:26px; top:26px; z-index:6; display:flex; gap:6px; }
.rig__dots i { width:20px; height:6px; border-radius:2px; background:rgba(232,241,240,.14); }
.rig__dots i.on { background:var(--hull-lamp); box-shadow:0 0 10px rgba(53,214,255,.8); }

/* Der Archiv-Knopf schwebt AUSSERHALB des Gehäuses, wie im Mockup */
.rig__back { position:absolute; left:0; top:-2px; z-index:20; font:600 11px var(--font-ui);
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-decoration:none;
  padding:8px 14px; border-radius:8px; background:#1a2225;
  box-shadow: inset 0 0 0 1px rgba(232,241,240,.16), 0 4px 14px rgba(0,0,0,.6); }
.rig__back:hover { color:var(--text); background:#232d31; }

/* ---------- Bildfläche: versenkt, mit Gitter ---------- */
.rig__screen { position:relative; z-index:3; padding:12px; border-radius:4px;
  background:
    repeating-linear-gradient(0deg, rgba(47,191,164,.05) 0 1px, transparent 1px 58px),
    repeating-linear-gradient(90deg, rgba(47,191,164,.05) 0 1px, transparent 1px 58px),
    radial-gradient(120% 90% at 50% 0%, #1b2427 0%, #0f1416 62%);
  box-shadow: inset 0 0 0 1px rgba(232,241,240,.09), inset 0 6px 18px rgba(0,0,0,.8); }
.rig__sub { margin:0 0 10px; text-align:center; font-size:var(--fs-5); color:var(--muted); }

/* ══════════════════════════════════════════════════════════════════
   Variante B — dieselbe Sprache, schlanker gerechnet.
   ══════════════════════════════════════════════════════════════════ */
.rig--slim { --side:36px; --top:74px; --bot:40px; --chamf:20px; }
.rig--slim .rig__cart { min-width:440px; padding:0 34px 4px; }
.rig--slim .rig__cart h1 { font-size:24px; }
.rig--slim .rig__sh::after { top:12px; height:14px; }
.rig--slim .rig__lamp { height:64px; width:8px; }
.rig--slim .rig__side { gap:18px; }
.rig--slim .rig__side::before { width:calc(var(--side) - 16px); }
.rig--slim .rig__vent { width:104px; height:14px; }
.rig--slim .rig__dots { right:14px; top:16px; }

/* ══════════════════════════════════════════════════════════════════
   Inhalt — reine Füllung. Diese Skizze entscheidet den RAHMEN.
   ══════════════════════════════════════════════════════════════════ */
.wb__grid { display:grid; grid-template-columns:minmax(0,430px) minmax(0,1fr) minmax(0,248px);
  gap:9px; height:var(--wbh, 400px); }
.wb__pane, .wb__rig { background:rgba(24,30,33,.86); border-radius:10px; display:flex;
  flex-direction:column; min-height:0; min-width:0; overflow:hidden; position:relative;
  box-shadow: inset 0 1px 0 rgba(232,241,240,.07), 0 3px 14px rgba(0,0,0,.4); }
.wb__scroll { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; scrollbar-width:none; }
.wb__scroll::-webkit-scrollbar { display:none; }
.wb__filters { flex:0 0 auto; padding:8px 9px; display:flex; flex-direction:column; gap:6px; }
.wb__help { font-size:var(--fs-5); color:var(--muted); padding:6px 9px; border-radius:8px;
  background:rgba(11,14,15,.34); cursor:pointer; }
.wb__frow { display:flex; align-items:center; gap:8px; }
.wb__search { flex:1; min-width:0; background:rgba(11,14,15,.4); border:0; color:var(--text);
  padding:7px 10px; font-size:var(--fs-6); border-radius:7px; font-family:inherit; }
.wb__c { font-size:var(--fs-4); color:var(--muted); font-family:var(--font-mono); }
.wb__chips { display:flex; gap:5px; flex-wrap:wrap; }
.wb__chip { font-size:var(--fs-4); padding:4px 9px; border:0; background:rgba(11,14,15,.36);
  color:var(--muted); border-radius:999px; cursor:pointer; font-family:inherit;
  transition:all var(--dur-fast) var(--ease-ui); }
.wb__chip:hover { background:#2b3438; color:var(--text); }
.wb__chip.is-on { background:var(--accent-2); color:var(--ink); font-weight:600; }
.wb__tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:5px;
  padding:0 8px 8px; }
.wb__tile { position:relative; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1px 6px;
  align-content:center; padding:5px 6px 5px 9px; border-radius:8px; cursor:pointer;
  background:rgba(11,14,15,.34); box-shadow: inset 0 1px 0 rgba(232,241,240,.05);
  transition:background var(--dur-fast) var(--ease-ui); }
.wb__tile:hover { background:#2a3235; }
.wb__tile.is-sel { background:color-mix(in srgb, var(--accent-2) 20%, transparent);
  box-shadow: inset 0 0 0 1px var(--accent-2); }
.wb__tn { grid-column:1/-1; font-size:var(--fs-5); font-weight:500; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wb__ts { align-self:center; font-size:var(--fs-3); color:var(--vio); font-family:var(--font-mono); }
.wb__pin { grid-column:2; align-self:center; width:26px; height:26px; display:grid;
  place-items:center; border:0; background:rgba(11,14,15,.44); color:var(--muted); cursor:pointer;
  border-radius:7px; line-height:0; transition:all var(--dur-fast) var(--ease-ui); }
.wb__pin svg { width:14px; height:14px; pointer-events:none; }
.wb__pin.is-on { background:var(--accent-2); color:var(--ink); }
.wb__id { padding:10px 13px 8px; flex:0 0 auto; }
.wb__idrow { display:flex; align-items:flex-start; gap:10px; }
.wb__id h2 { font-size:var(--fs-13); font-weight:600; line-height:1.05; margin:0; }
.wb__tags { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.wb__tag { font-size:var(--fs-3); padding:2px 7px; border-radius:999px;
  background:rgba(11,14,15,.36); color:var(--muted); }
.wb__tag.is-rar { background:color-mix(in srgb, var(--accent-2) 18%, transparent); color:var(--accent-2); }
.wb__tag.is-vol { background:var(--vio-dim); color:var(--vio); }
.wb__sigbox { margin-left:auto; text-align:right; }
.wb__lbl { font-size:var(--fs-4); color:var(--muted); letter-spacing:var(--ls-4); }
.wb__sigbox b { display:block; font-size:var(--fs-11); color:var(--vio); font-weight:600;
  line-height:1.1; font-family:var(--font-mono); }
.wb__pinbig { display:inline-flex; align-items:center; gap:7px; align-self:center; white-space:nowrap;
  padding:8px 12px; border:0; border-radius:9px; cursor:pointer; font-family:inherit;
  font-size:var(--fs-5); font-weight:600; color:var(--text); background:#252d30;
  box-shadow: inset 0 0 0 1px rgba(232,241,240,.12); }
.wb__pinbig svg { width:16px; height:16px; }
.wb__sec { padding:0 13px 10px; }
.wb__sec h4 { font-size:var(--fs-4); font-weight:600; color:var(--muted); margin:0 0 7px;
  padding-bottom:5px; position:relative; }
.wb__sec h4::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:repeating-linear-gradient(90deg, rgba(232,241,240,.14) 0 1px, transparent 1px 7px); }
.wb__locs { display:flex; flex-direction:column; gap:3px; }
.wb__row2 { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
  padding:5px 9px; border-radius:7px; background:rgba(11,14,15,.3); }
.wb__row2 .p { font-size:var(--fs-5); font-weight:500; color:var(--text); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wb__row2 .s { font-size:var(--fs-3); color:var(--muted); display:block; margin-top:1px; }
.wb__row2 .r { display:flex; align-items:center; gap:8px; }
.wb__lpin { width:22px; height:22px; display:grid; place-items:center; border:0;
  background:rgba(11,14,15,.44); color:var(--muted); cursor:pointer; border-radius:6px; line-height:0; }
.wb__lpin svg { width:12px; height:12px; }
.wb__lpin.is-on { background:var(--accent-2); color:var(--ink); }
.wb__bar { width:44px; height:5px; border-radius:3px; overflow:hidden; background:rgba(11,14,15,.6);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
.wb__bar i { display:block; height:100%;
  background:repeating-linear-gradient(90deg, var(--vio) 0 3px, transparent 3px 5px); }
.wb__row2 em { font-size:var(--fs-4); color:var(--muted); font-style:normal; width:54px;
  text-align:right; font-family:var(--font-mono); }
.wb__links { display:flex; gap:6px; flex-wrap:wrap; }
.wb__link { display:inline-flex; gap:6px; padding:6px 10px; border-radius:7px;
  background:rgba(11,14,15,.36); color:var(--text); font-size:var(--fs-5); text-decoration:none; }
.wb__link b { color:var(--accent-2); font-family:var(--font-mono); }
#tabbar { flex:0 0 auto; display:flex; gap:5px; padding:8px 9px; }
.wb__tab { flex:1; font-size:var(--fs-4); padding:5px 8px; border:0; border-radius:7px;
  background:rgba(11,14,15,.36); color:var(--muted); cursor:pointer; font-family:inherit; }
.wb__tab.is-on { background:var(--accent-2); color:var(--ink); font-weight:600; }
.wb__scanbox { padding:8px 9px; }
.wb__scan { width:100%; background:rgba(11,14,15,.5); border:0; color:var(--vio); padding:8px 10px;
  font-size:var(--fs-9); text-align:center; border-radius:7px; font-family:var(--font-mono);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
.wb__scan::placeholder { color:var(--muted); font-family:var(--font-ui); font-size:var(--fs-5); }
.trk { margin:8px 9px; padding:10px; border-radius:10px; background:rgba(11,14,15,.36); }
.trk__hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.trk__hd b { font-size:var(--fs-6); }
.trk svg { display:block; width:100%; height:70px; }
.wb__empty { padding:14px 12px; text-align:center; color:var(--muted); font-size:var(--fs-4);
  line-height:1.5; margin:0; }
.wb__rig { flex-direction:row; align-items:center; gap:16px; padding:8px 13px; margin-top:9px;
  flex:0 0 auto; }
.wb__rig::before { content:''; position:absolute; left:0; right:0; top:0; height:2px;
  background:repeating-linear-gradient(90deg, var(--accent-2) 0 5px, transparent 5px 10px); opacity:.5; }
.wb__rgrp { display:flex; flex-direction:column; gap:3px; }
.wb__sel { background:#222a2d; border:0; color:var(--text); font-size:var(--fs-5); padding:6px 9px;
  border-radius:7px; font-family:inherit; cursor:pointer; }
.wb__frac { margin-left:auto; display:flex; align-items:center; gap:11px; padding:8px 12px;
  border-radius:9px; text-decoration:none; background:rgba(11,14,15,.36);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
.wb__frac__t { display:flex; flex-direction:column; line-height:1.25; }
.wb__frac__t b { font-size:var(--fs-5); color:var(--text); }
.wb__frac__go { font-size:var(--fs-4); font-weight:600; color:var(--accent); }

.gauge { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px auto 40px;
  width:1280px; max-width:calc(100vw - 32px); }
.gauge div { background:#1a2124; border-radius:10px; padding:10px 12px; }
.gauge span { display:block; font-size:11px; color:var(--muted); letter-spacing:.05em;
  text-transform:uppercase; }
.gauge b { font:600 21px var(--font-mono); color:var(--accent); }
.gauge b.bad { color:#ff6b6b; }

#sketch-tools { position:fixed; bottom:12px; right:12px; z-index:9999; font-family:system-ui;
  font-size:12px; background:rgba(0,0,0,.78); color:#fff; padding:8px 12px; border-radius:8px;
  opacity:.4; transition:opacity .2s; display:flex; gap:8px; }
#sketch-tools button { font:inherit; font-size:11px; border:0; border-radius:5px; padding:3px 7px;
  background:#333; color:#fff; cursor:pointer; }
body.no-vio { --vio:#2FBFA4; --vio-2:#2FBFA4; --vio-dim:rgba(47,191,164,.2); }
body.no-lamp .rig__lamp { background:#20282a; box-shadow:none; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="ttl">008 · Gehäuse 1:1</span>
  <button class="variant-tab active" data-v="a">A: Gehäuse voll</button>
  <button class="variant-tab" data-v="b">B: Gehäuse schlank</button>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 3h5M11 3v6.2L7.4 13h9.2L13 9.2V3M12 13v8"/>
  </symbol>
</svg>

<div id="variant-a" class="variant active">
  <div class="stage">
    <div class="stage__cap"><b>A — Gehäuse voll</b>
      <span>Holme 64 px, Kopfband 104 px, Sockel 62 px. Das Mockup ohne Abschwächung.</span></div>
    <div class="stage__vp">
      <div class="rig" data-hull data-rig></div>
      <div class="fold"></div>
    </div>
  </div>
  <div class="gauge" data-gauge></div>
</div>

<div id="variant-b" class="variant">
  <div class="stage">
    <div class="stage__cap"><b>B — Gehäuse schlank</b>
      <span>Dieselbe Sprache, aber Holme 36, Kopf 74, Sockel 40 — was das an Mineralzeilen zurückholt.</span></div>
    <div class="stage__vp">
      <div class="rig rig--slim" data-hull data-rig></div>
      <div class="fold"></div>
    </div>
  </div>
  <div class="gauge" data-gauge></div>
</div>

<div id="sketch-tools" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='.4'">
  <button onclick="document.body.classList.toggle('no-vio')">Violett aus/an</button>
  <button onclick="document.body.classList.toggle('no-lamp')">Leuchten aus/an</button>
</div>

<script>
/* Echte Daten aus assets/mining-db.json + mining-model.json. */
const MIN = [
  ['Quantainium','legendary',3170],['Savrilium','legendary',3200],['Stileron','legendary',3185],
  ['Lindinium','epic',3400],['Ouratite','epic',3370],['Riccite','epic',3385],
  ['Beryl','rare',3540],['Bexalite','rare',3600],['Borase','rare',3570],['Gold','rare',3585],
  ['Taranite','rare',3555],['Agricium','uncommon',3885],['Aslarite','uncommon',3840],
  ['Laranite','uncommon',3825],['Titanium','uncommon',3855],['Torite','uncommon',3900],
  ['Tungsten','uncommon',3870],['Aluminum','common',4285],['Copper','common',4240],
  ['Corundum','common',4225],['Hephaestanite','common',4180],['Ice','common',4300],
  ['Iron','common',4270],['Quartz','common',4210],['Silicon','common',4255],['Tin','common',4195],
  ['Aphorite',null,3000],['Beradom',null,4000],['Carinite',null,4000],['Dolivine',null,3000],
  ['Feynmaline',null,4000],['Glacosite',null,4000],['Hadanite',null,3000],['Jaclium',null,3000],
  ['Janalite',null,3000],['Sadaryx',null,3000],['Saldynium',null,3000],
];
const LOCS = [
  ['Aaron Halo','Stanton · Gürtel'],['Asteroid Cluster (Low Yield)','Stanton · Cluster'],
  ['Asteroid Cluster (Medium Yield)','Stanton · Cluster'],['Hurston','Stanton · Planet'],
  ['microTech','Stanton · Planet'],['Aberdeen','Stanton · Mond'],['Arial','Stanton · Mond'],
];
const RAR = { legendary:'legendär', epic:'episch', rare:'selten', uncommon:'ungewöhnlich', common:'häufig' };
const pinSvg = '<svg><use href="#i-pin"/></svg>';

function curve() {
  const pts = [];
  for (let x = 0; x <= 100; x++) pts.push(`${x*2.6},${8 + 56*(1 - Math.exp(-x/26))}`);
  return `<div class="trk">
    <div class="trk__hd"><b>Stabilität</b><span class="wb__lbl">bis Bruch 01:28</span></div>
    <svg viewBox="0 0 260 70" preserveAspectRatio="none">
      <defs><linearGradient id="g${Math.round(pts.length)}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="var(--vio)" stop-opacity=".45"/>
        <stop offset="100%" stop-color="var(--vio)" stop-opacity="0"/></linearGradient></defs>
      <polygon fill="url(#g101)" points="0,70 ${pts.join(' ')} 260,70"/>
      <polyline fill="none" stroke="var(--vio)" stroke-width="1.8" points="${pts.join(' ')}"/>
      <circle cx="260" cy="63" r="3" fill="var(--vio-2)"/></svg></div>`;
}

function content() { return `
  <div class="wb__grid">
    <div class="wb__pane">
      <div class="wb__filters">
        <div class="wb__help">▸ Wie funktioniert die Mining-Werkbank?</div>
        <div class="wb__frow">
          <input class="wb__search" type="search" placeholder="Mineral suchen">
          <span class="wb__c" data-count>37</span></div>
        <div class="wb__chips">
          <button class="wb__chip">Pyro</button><button class="wb__chip">Stanton</button>
          <button class="wb__chip">Nyx</button></div>
      </div>
      <div class="wb__scroll"><div class="wb__tiles">${MIN.map((m,i)=>`
        <div class="wb__tile${i===0?' is-sel':''}" data-min="${m[0]}" role="button" tabindex="0">
          <span class="wb__tn">${m[0]}</span><span class="wb__ts">${m[2]}</span>
          <button class="wb__pin" aria-label="Anheften: ${m[0]}">${pinSvg}</button>
        </div>`).join('')}</div></div>
    </div>
    <div class="wb__pane">
      <div class="wb__id"><div class="wb__idrow">
        <div><h2 data-name>Quantainium</h2>
          <div class="wb__tags"><span class="wb__tag is-rar">legendär</span>
            <span class="wb__tag is-vol">hochflüchtig</span><span class="wb__tag">Schiff</span>
            <span class="wb__tag">Erz</span><span class="wb__tag">raffinierbar</span></div></div>
        <div class="wb__sigbox"><span class="wb__lbl">Signatur</span><b data-sig>3170</b></div>
        <button class="wb__pinbig">${pinSvg}Anheften</button>
      </div></div>
      <div class="wb__scroll">
        <div class="wb__sec"><h4>Fundorte: 17</h4><div class="wb__locs">${LOCS.map(l=>`
          <div class="wb__row2">
            <span><span class="p">${l[0]}</span><span class="s">${l[1]} — Schiff, bis 78.3 %</span></span>
            <span class="r"><button class="wb__lpin">${pinSvg}</button>
              <span class="wb__bar"><i style="width:36%"></i></span><em>2 %</em></span>
          </div>`).join('')}</div></div>
        <div class="wb__sec"><h4>Verwendung</h4><div class="wb__links">
          <a class="wb__link" href="#">Blueprints <b>187</b></a>
          <a class="wb__link" href="#">Prospector <b>32 SCU</b></a>
          <a class="wb__link" href="#">MOLE <b>96 SCU</b></a></div></div>
      </div>
    </div>
    <div class="wb__pane">
      <div id="tabbar"><button class="wb__tab is-on">Signaturen</button>
        <button class="wb__tab">Fundorte: 1</button></div>
      <div class="wb__scanbox"><input class="wb__scan" placeholder="Scanwert"></div>
      ${curve()}
      <p class="wb__empty">Auf einer Erz-Kachel links den Anheft-Knopf drücken.</p>
    </div>
  </div>
  <div class="wb__rig">
    <div class="wb__rgrp"><span class="wb__lbl">Station</span>
      <select class="wb__sel"><option>Port Olisar — Starlight</option><option>Ruin Station</option></select></div>
    <a class="wb__frac" href="#"><span class="wb__frac__t"><b>Fracturing-Rechner</b>
      <span class="wb__lbl">Quantainium</span></span>
      <span class="wb__frac__go">Bricht der Brocken? →</span></a>
  </div>`;
}

/* Das Gehäuse selbst — identisches Markup für beide Varianten, nur die
   Maßvariablen unterscheiden sich (.rig--slim). */
function rig() { return `
  <a class="rig__back" href="#">← Archiv</a>
  <div class="rig__head">
    <div class="rig__sh rig__sh--l"></div>
    <div class="rig__cart">
      <span class="ver">Alpha 4.9.0 · Live-Daten</span>
      <h1>Mining</h1>
    </div>
    <div class="rig__sh rig__sh--r"></div>
  </div>
  <div class="rig__dots"><i class="on"></i><i class="on"></i><i></i><i></i></div>
  <div class="rig__side rig__side--l"><span class="rig__lamp"></span><span class="rig__lamp"></span></div>
  <div class="rig__side rig__side--r"><span class="rig__lamp"></span><span class="rig__lamp"></span></div>
  <div class="rig__screen">
    <p class="rig__sub">Erz wählen — Fundorte, Physik und Raffinerie-Ertrag stehen daneben.</p>
    ${content()}
  </div>
  <div class="rig__base">
    <span class="rig__vent"></span>
    <span class="rig__mark">Mining Ops · Verse Base</span>
    <span class="rig__vent"></span>
  </div>
  <span class="rig__bolt" style="left:14px;top:14px"></span>
  <span class="rig__bolt" style="right:14px;top:14px"></span>
  <span class="rig__bolt" style="left:14px;bottom:14px"></span>
  <span class="rig__bolt" style="right:14px;bottom:14px"></span>`;
}

document.querySelectorAll('[data-rig]').forEach(el => el.innerHTML = rig());

document.querySelectorAll('.variant').forEach(root => {
  const sel = (q) => root.querySelector(q);
  root.addEventListener('click', (e) => {
    const pin = e.target.closest('.wb__pin, .wb__lpin, .wb__pinbig');
    if (pin) { e.stopPropagation(); pin.classList.toggle('is-on'); return; }
    const chip = e.target.closest('.wb__chip');
    if (chip) { chip.classList.toggle('is-on'); return; }
    const tab = e.target.closest('.wb__tab');
    if (tab) { root.querySelectorAll('.wb__tab').forEach(t=>t.classList.remove('is-on'));
               tab.classList.add('is-on'); return; }
    const tile = e.target.closest('.wb__tile');
    if (tile) {
      root.querySelectorAll('.wb__tile').forEach(t => t.classList.remove('is-sel'));
      tile.classList.add('is-sel');
      const rec = MIN.find(m => m[0] === tile.dataset.min);
      sel('[data-name]').textContent = rec[0];
      sel('[data-sig]').textContent = rec[2];
      sel('.wb__tag.is-rar').textContent = RAR[rec[1]] || 'ohne Stufe';
      sel('.wb__frac__t .wb__lbl').textContent = rec[0];
    }
  });
  const q = sel('.wb__search');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase(); let n = 0;
    root.querySelectorAll('.wb__tile').forEach(t => {
      const hit = t.dataset.min.toLowerCase().includes(v);
      t.style.display = hit ? '' : 'none'; if (hit) n++; });
    sel('[data-count]').textContent = n;
  });
});

function fit(root) {
  const grid = root.querySelector('.wb__grid');
  const rigbar = root.querySelector('.wb__rig');
  const hull = root.querySelector('[data-hull]');
  const vpTop = root.querySelector('.stage__vp').getBoundingClientRect().top;
  grid.style.setProperty('--wbh', 'auto');
  const top = grid.getBoundingClientRect().top - vpTop;
  let h = 720 - top - rigbar.offsetHeight - 20;
  grid.style.setProperty('--wbh', h + 'px');
  const over = hull.getBoundingClientRect().bottom - vpTop - 720;
  if (over > 0) grid.style.setProperty('--wbh', (h - Math.ceil(over)) + 'px');
}

function measure(root) {
  const hull = root.querySelector('[data-hull]');
  const grid = root.querySelector('.wb__grid');
  const rigbar = root.querySelector('.wb__rig');
  const g = root.querySelector('[data-gauge]');
  const tile = root.querySelector('.wb__tile');
  const vpTop = root.querySelector('.stage__vp').getBoundingClientRect().top;
  const gridTop = grid.getBoundingClientRect().top - vpTop;
  const chrome = gridTop + rigbar.offsetHeight + 10;
  const tileTop = tile.getBoundingClientRect().top - vpTop;
  let visible = 0;
  root.querySelectorAll('.wb__tile').forEach(t => {
    if (t.getBoundingClientRect().bottom - vpTop <= 720) visible++; });
  const over = Math.max(0, Math.round(hull.getBoundingClientRect().bottom - vpTop - 720));
  g.innerHTML = `
    <div><span>Gehäuse-Aufschlag</span><b class="${chrome>260?'bad':''}">${Math.round(chrome)} px</b></div>
    <div><span>Erste Kachel bei</span><b class="${tileTop>260?'bad':''}">${Math.round(tileTop)} px</b></div>
    <div><span>Kacheln über der Falz</span><b class="${visible<24?'bad':''}">${visible} / 37</b></div>
    <div><span>Überlauf unter 720</span><b class="${over>0?'bad':''}">${over} px</b></div>`;
}

function showVariant(v) {
  document.querySelectorAll('.variant').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  const root = document.getElementById('variant-' + v);
  root.classList.add('active');
  document.querySelector(`.variant-tab[data-v="${v}"]`).classList.add('active');
  fit(root); measure(root);
}
document.querySelectorAll('.variant-tab').forEach(t =>
  t.addEventListener('click', () => showVariant(t.dataset.v)));
window.addEventListener('load', () => { ['a','b'].forEach(showVariant); showVariant('a'); });
</script>
</body>
</html>
