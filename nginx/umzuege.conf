# Umgezogene Seiten: alte Adresse -> neue Adresse, als 301 aus location /.
# Eingebunden ueber map $uri $vb_umzug in default.conf. Eintraege bleiben
# stehen, solange die alte Adresse irgendwo verlinkt oder indexiert sein kann;
# verify:redirects prueft, dass jede Quelle keine gebaute Seite ist und jedes
# Ziel eine.
#
# 19.11.2026, 4.10.3: Sprachdatei-Schluessel mit ",P" werden gelesen. Missionen
# heissen jetzt wie im Spiel statt nach ihrem internen Namen, mehrere Familien
# sind zu einer verschmolzen. Ballista und Spartan tragen den Namen "HM6 …".
# Drei Kategorieseiten entfallen, weil ihre Items jetzt richtig einsortiert sind.
#
# 24.11.2026, Kategorie-Ordnung (Krisz: „Ja, 301 auf die neue Kategorie“):
# „Other“ ist nach Art aufgeteilt (scripts/lib/kategorie-ordnung.mjs) und hat
# nur noch vier Listenseiten; other-5 bis other-12 leiten auf die erste, wie
# other-13 zuvor. „Armour / Engineer / Light“ und „Armour / Torso“ trugen je
# ein Item, das jetzt bei den Helmen bzw. beim Oberkoerper steht.
#
# 24.11.2026, IA C8: 56 Items standen doppelt, einmal unter einem alten Namen
# oder in anderer Schreibweise (mit Preisen und Fundorten) und einmal unter dem
# Namen im Spiel (mit Spielwerten). Sie sind zu der Seite mit dem Spielnamen
# zusammengelegt (scripts/lib/item-namen-aliase.mjs, eingetragen von
# scripts/namen-zusammenfuehren.mjs). Wo nur die Schreibweise abwich, behaelt
# die zusammengelegte Seite die bekannte Adresse und die „-2"-Adresse zieht um.
