# Origin server config for verse-base.com — static Astro build served by nginx.
# Coolify runs this image behind Cloudflare: Cloudflare terminates TLS and forwards
# these response headers to the browser over HTTPS, so headers set here reach the
# client on the secure connection (that's why HSTS set at the origin is honoured).
#
# Replaces the stock nginx `default.conf`. Kept deliberately close to stock — the
# additions are the security-header block, a real 404 page and Cache-Control.

# --- Cache-Control nach Inhaltstyp -------------------------------------------
# Als map + `expires $var` statt Regex-Locations: eine location ~* \.html$ würde
# die /en/-Redirect-Prefixes und try_files aushebeln (Regex schlägt Prefix), und
# add_header in einer location verwirft die Security-Header des server-Blocks.
# `expires` hat beide Probleme nicht (eigene Direktive, Vererbung bleibt intakt).
#   - HTML: -1 = no-cache — Deploys tauschen Dateien unter fester URL, Browser
#     sollen revalidieren (nginx liefert ETag/Last-Modified; 304 ist billig).
#   - Bilder/Video/Fonts: ändern sich praktisch nie -> 30 Tage.
#   - CSS/JS/JSON unter fester URL (assets/*.js, *-db.json): 1 Tag — Deploy-
#     Änderungen sollen zeitnah ankommen; gehashte Dateien regelt der Block unten.
map $sent_http_content_type $vb_expires {
    default                    off;
    ~text/html                 -1;
    ~image/                    30d;
    ~video/                    30d;
    ~font/                     30d;
    ~text/css                  1d;
    ~application/javascript    1d;
    ~application/json          1d;
}

# --- Reichweitenmessung abwählbar ---------------------------------------------
# Zwei Zähler laufen: Cloudflare Web Analytics (Beacon wird an der Edge in JEDE
# HTML-Antwort gehängt, am Ursprung nicht herausnehmbar) und das selbst
# gehostete Umami auf stats.verse-base.com (Tag steht in Layout.astro).
# Was der Ursprung kann: beide nicht erlauben. Trägt der Browser das Cookie
# `vb_noanalytics=1`, fallen die Hosts aus script-src/connect-src — die Zähler
# laden in GENAU DIESEM Browser nicht, für alle anderen ändert sich nichts.
# Das ist auch der Grund, warum der Umami-Tag fest im HTML stehen darf: die
# Entscheidung fällt pro Aufruf in der Kopfzeile, nicht im gebauten Markup.
# Gesetzt wird das Cookie auf der Datenschutzseite (#opt-out) und automatisch
# für angemeldete Admins (assets/account-lite.js), sonst nirgends.
# Sicher gegen geteilte Caches, weil HTML no-cache ist (map oben, -1): es liegt
# keine fremde Kopie mit der Kopfzeile eines anderen Besuchers herum.
# Der Vorschau-Build leert die beiden Vorgaben (siehe Dockerfile, STAGING=1).
map $http_cookie $vb_rum_script {
    default             "https://static.cloudflareinsights.com https://stats.verse-base.com";
    ~*vb_noanalytics=1  "";
}
map $http_cookie $vb_rum_connect {
    default             "https://cloudflareinsights.com https://stats.verse-base.com";
    ~*vb_noanalytics=1  "";
}

# --- Pfad ohne Schrägstrich am Ende -------------------------------------------
# Grundlage der .html-Zwillingsregel unten (location /): /schiffe und /schiffe/
# sollen dieselbe Datei /schiffe.html treffen. Die Wurzel "/" bleibt unberührt
# (das Muster verlangt mindestens ein Zeichen vor dem Schrägstrich).
map $uri $vb_base {
    default    $uri;
    ~^(/.+)/$  $1;
}

# --- Testpilot-Tuersteher (Phase 14 Plan 01, D-04/D-06/D-11/D-23/D-24) --------
# Einzelstueck fuer staging (D-12): dasselbe Image wie live, nur $vb_gate_on
# entscheidet, ob das Tor greift. Sein Vorgabewert "0" (= aus) wird NUR im
# Vorschau-Bau per sed auf "1" gesetzt (Dockerfile, mit Gegenkontrolle) — ohne
# STAGING=1 aendert sich am Verhalten der Live-Seite nichts.
# js_import laedt das njs-Modul (nginx/gate.js); js_set wertet es NUR aus,
# wenn $vb_gate_ok tatsaechlich in einem location-Block gelesen wird (nginx-
# Variablen sind lazy) — die Ausnahme-Locations unten fragen es deshalb gar
# nicht erst ab und rufen check() nie auf.
#
# Mehrzeilig geschrieben (nicht "{ default "0"; }" auf einer Zeile): der
# STAGING-sed im Dockerfile ist woertlich vom vb_rum_*-Muster oben kopiert
# und braucht eine Zeile, die exakt mit "}" beginnt, um den Adressbereich
# zu schliessen — das war der erste Fehlschlag der E2E-Sonde (Lauf
# 32045111301): der sed griff auf einer einzeiligen Map nicht, aber die
# Gegenkontrolle bemerkte es zuverlaessig und brach den Bau.
js_import gate from /etc/nginx/gate.js;
map $host $vb_gate_on {
    default "0";
}
js_set $vb_gate_ok gate.check;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # njs' ngx.fetch() (gate.mint(), server-zu-server gegen Supabase) loest
    # den Hostnamen zur ANFRAGEZEIT auf, nicht beim Konfigurationsladen wie
    # ein statisches proxy_pass — ohne einen resolver bricht das mit "no
    # resolver defined". 127.0.0.11 ist Dockers eingebauter DNS-Server, in
    # JEDEM Container auf einem benutzerdefinierten Netz erreichbar (Coolify
    # wie auch die CI-Sonde) und reicht externe Namen an den Host weiter.
    resolver 127.0.0.11 valid=30s;

    # ca-certificates im Image (Dockerfile) reicht NICHT: ngx.fetch() prueft
    # das Supabase-Zertifikat, und dieser server{}-Block hat gar keinen
    # eigenen SSL-Kontext (nur `listen 80`, TLS terminiert bei Cloudflare) —
    # das generische ssl_trusted_certificate griff deshalb NICHT (Lauf
    # 32050036283, derselbe Fehler trotz gesetzter Zeile). ngx_http_js_module
    # hat fuer genau diesen Fall eine EIGENE, von ssl_trusted_certificate
    # unabhaengige Direktive: js_fetch_trusted_certificate — nur sie steuert,
    # welchem Buendel ngx.fetch() bei ausgehenden HTTPS-Verbindungen traut.
    js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Redirects RELATIV ausliefern ("Location: /schiffe/x.html").
    # Sonst baut nginx eine ABSOLUTE URL aus $scheme://$host — und $scheme ist
    # hier immer "http", weil Cloudflare TLS terminiert und uns unverschlüsselt
    # anspricht. Ergebnis waeren 301s von https:// nach http:// (Extra-Hop ueber
    # den HTTPS-Redirect, Mixed-Content-Block bei fetch(), verschenkte
    # Link-Equity). Relative Locations sind laut RFC 7231 gueltig und loesen
    # beim Client gegen das aktuelle Schema auf.
    absolute_redirect off;

    # --- Security response headers ---------------------------------------------
    # Fixes Cloudflare Security Insights finding "Domains without HSTS".
    # HSTS: 1 year, includes subdomains (all *.verse-base.com run through Cloudflare
    # TLS, so they are HTTPS-capable). No `preload` on purpose — preload bakes the
    # domain into browsers' hardcoded HTTPS list and is very hard to undo; it should
    # be a separate, deliberate submission to hstspreload.org, not bundled here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Zero-risk hardening that belongs with HSTS on a static content site:
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Clickjacking: die Seite rahmt fremde Inhalte (YouTube), wird aber selbst
    # NIRGENDS eingebettet — geprüft über alle <iframe> im Build. DENY ist damit
    # folgenlos. Modernen Browsern sagt das `frame-ancestors 'none'` der CSP
    # unten dasselbe; X-Frame-Options bleibt für die alten daneben stehen.
    add_header X-Frame-Options          "DENY"                           always;

    # --- Content Security Policy -----------------------------------------------
    # Ehrlich zur Lage: `script-src` MUSS 'unsafe-inline' enthalten. Die Seiten
    # tragen ihr JS und CSS bewusst inline (eine Patch-Seite hat 8 <script> und
    # 3 <style> im Dokument), ein statisches nginx kann keine Nonces pro Antwort
    # vergeben, und Hashes über 17.000 Seiten wären nicht pflegbar. Damit ist der
    # XSS-Schutz der Richtlinie praktisch aus — das ist der Preis der Architektur
    # und keine Nachlässigkeit.
    #
    # Was sie trotzdem leistet, und weshalb sie hier steht — das sind die
    # Direktiven, die scharf gestellt sind und nichts kosten:
    #   frame-ancestors  — Clickjacking, deckungsgleich mit X-Frame-Options
    #   object-src       — keine Plugin-Einbettung, ohne Ausnahme
    #   base-uri         — ein eingeschleustes <base> kann keine relativen
    #                      URLs mehr auf einen fremden Host umbiegen
    #   form-action      — Formulardaten gehen nur an uns und an Web3Forms
    #
    # Die Ressourcen-Listen sind über ALLE 17.363 gebauten Seiten gemessen
    # (scripts/audit-csp.mjs), nicht aus Stichproben geraten — eine einzige
    # übersehene Quelle bricht live und wird erst im Nutzerbericht sichtbar:
    #   img    api.fleetyards.net (3.564 Schiffsbilder!), media.starcitizen.tools
    #          (2.310), cstone.space (240); data: für die inline-Herstellerlogos.
    #          Dazu der Supabase-Storage: hochgeladene Profilbilder und Banner
    #          liegen dort, ihre URL kommt aber aus der DATENBANK und steht in
    #          keiner gebauten Seite — die Messung kann sie nicht sehen. Ohne
    #          diesen Eintrag blockt der Browser jedes Profilbild still: die
    #          Piloten-Seite zeigt einen leeren Kreis und ein schwarzes Banner,
    #          obwohl der Upload funktioniert hat. Deshalb hält scripts/audit-csp.mjs
    #          den Eintrag jetzt als Laufzeit-Fähigkeit fest.
    #   script www.youtube.com — die Schiffs-Datenblätter laden das YouTube-
    #          iframe_api als echtes externes <script>
    #   frame  YouTube-Einbettung (Klick-zu-Laden, nocookie-Variante)
    #   connect Supabase (Auth/Profil/Favoriten) + Web3Forms (Feedback).
    #          Kein wss: — Präsenz läuft bewusst über Polling, nicht Realtime.
    #   font   ausschließlich lokal unter /assets/fonts
    #
    # Zwei Hosts kommen in KEINER gebauten Seite vor und können deshalb gar nicht
    # gemessen werden: Cloudflare hängt den Web-Analytics-Zähler erst an der Edge
    # ins HTML (script static.cloudflareinsights.com, connect cloudflareinsights.com
    # für den POST auf /cdn-cgi/rum). Sie kommen aus den beiden `vb_rum_*`-Maps
    # oben — dort haengt auch das Opt-out per Cookie. Fehlen sie, blockt
    # die Richtlinie den Zähler still — genau so war er vom 28.07. bis 31.07.2026
    # tot, ohne dass irgendetwas rot wurde. Vor dem Entfernen erst im Cloudflare-
    # Dashboard nachsehen, ob Web Analytics noch läuft.
    #
    # `blob:` und 'wasm-unsafe-eval' sind KEIN Schlendrian, sondern das, was der
    # 3D-Hologramm-Viewer braucht: DRACOLoader baut seinen Worker aus einem Blob
    # (addons/loaders/DRACOLoader.js: `new Worker(URL.createObjectURL(...))`) und
    # dekomprimiert die Meshes per WebAssembly; GLTFLoader legt Texturen als
    # blob:-URLs an, hero-video.js ebenso für das Hintergrundvideo. Ohne diese
    # drei Einträge bleiben die Schiffs-Datenblätter ohne Hologramm.
    # `child-src` doppelt worker-/frame-src für Browser, die worker-src noch
    # nicht kennen. <link rel=preconnect> unterliegt der CSP nicht — i.ytimg.com
    # steht deshalb bewusst nirgends.
    #
    # Kommt eine Quelle dazu, meldet sich die Browser-Konsole — dann HIER
    # ergänzen und `npm run audit:csp` erneut laufen lassen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.youtube.com $vb_rum_script; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.fleetyards.net https://media.starcitizen.tools https://cstone.space https://trgjhmbnodoarnfmlcqx.supabase.co; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob: https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' blob: https://trgjhmbnodoarnfmlcqx.supabase.co https://api.web3forms.com $vb_rum_connect; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'" always;

    # Cache-Control per Inhaltstyp (map oben). Gilt für alle Antworten dieses
    # server-Blocks; Cloudflare übernimmt Origin-Cache-Control fürs Edge.
    expires $vb_expires;

    # Astro-Bundles unter /_astro/ tragen einen Content-Hash im Dateinamen —
    # jede Änderung erzeugt eine NEUE URL, der Inhalt einer URL ist unveränderlich.
    # ^~ (Prefix, stoppt Regex-Suche) statt Regex: lässt /en/-Redirects und
    # try_files der anderen Pfade unangetastet. expires überschreibt die map.
    location ^~ /_astro/ {
        # D-06 sperrt ausdruecklich auch die Astro-Buendel — ohne diese Zeile
        # waeren sie ueber ihre content-gehashte URL auch ohne Ausweis lesbar.
        if ($vb_gate_ok = "0") { return 302 /gate.html?next=$uri; }
        expires 1y;
    }

    # Der Build-Stempel beantwortet die Frage „liefert die Seite den neuen
    # Stand aus?" (scripts/check-deployed.mjs, npm run check:staging). Eine
    # gecachte Antwort darauf ist WERTLOS — die Inhaltstyp-Map oben gaebe ihm
    # als application/json sonst einen Tag Cache-Zeit, und ein Deploy-Check
    # koennte bis zu 24 Stunden lang den Vorgaengerstand bestaetigen. Genau
    # der Irrtum, gegen den der Stempel gebaut ist.
    #
    # ⚠ NUR `expires -1` (ergibt Cache-Control: no-cache) und bewusst KEIN
    # `add_header Cache-Control …`: ein add_header in einer location verwirft
    # die Security-Header des server-Blocks — HSTS, CSP, X-Frame-Options waeren
    # fuer diese Datei weg. Genau davor warnt der Kommentar am Kopf dieser
    # Datei. `no-cache` reicht auch: es erlaubt kein Ausliefern ohne
    # Rueckfrage beim Ursprung, und der Stempel ist winzig.
    # Ausnahme vom Testpilot-Tor (D-07): der Stempel traegt nur Commit-Hash
    # und Datum, nichts Schuetzenswertes, und npm run check:staging (CLAUDE.md-
    # Pflicht vor jeder Fertig-Meldung) muss auch OHNE Ausweis funktionieren.
    # Diese location fragt $vb_gate_ok deshalb bewusst nicht ab.
# GATE-AUSNAHME: /build.json — D-07, npm run check:staging (CLAUDE.md-Pflicht vor jeder Fertig-Meldung) muss auch ohne Ausweis funktionieren; der Stempel traegt nur Commit-Hash und Datum, nichts Schuetzenswertes
    location = /build.json {
        expires -1;
    }

    # 3D-Holo-Meshes (.glb): nginx kennt den Typ nicht -> lieferte
    # application/octet-stream OHNE Cache-Header (jeder Besuch lud das Mesh neu).
    # `types` ERSETZT die geerbte MIME-Map komplett — darum nur in dieser
    # location gesetzt (hier liegen ausschliesslich .glb). Die Mesh-URLs tragen
    # einen Content-Hash als ?v= (aus holo-meshes.json) — der Inhalt einer URL
    # ist damit unveraenderlich, also 1 Jahr wie /_astro/.
    location ^~ /holo/ {
        # D-06 sperrt ausdruecklich auch die 3D-Netze — sonst waeren sie ueber
        # ihre versionierte URL auch ohne Ausweis ladbar.
        if ($vb_gate_ok = "0") { return 302 /gate.html?next=$uri; }
        types { model/gltf-binary glb; }
        expires 1y;
    }

    # --- Testpilot-Tor: Mint-Endpunkt + Ausnahmeliste ---------------------------
    # Ausstellungspunkt fuer den Ausweis (D-24, same-origin) — die Torseite
    # ruft ihn per fetch() same-origin auf, nachdem sie ein Supabase-Access-
    # Token in localStorage hat. gate.mint() setzt seine Cookies ueber
    # r.headersOut aus njs heraus, NICHT per add_header (Kopfkommentar dieser
    # Datei) — damit bleiben HSTS/CSP/X-Frame-Options aus dem server-Block
    # erhalten.
# GATE-AUSNAHME: /_gate/mint — der Ausstellungspunkt selbst (D-24); ohne ihn koennte niemand je einen Ausweis bekommen
    location ^~ /_gate/mint {
        # Im Live-Bau gibt es hier nichts auszustellen: $vb_gate_on steht dort
        # fest auf "0" (D-12), ein Ausweis waere folgenlos. Ohne diesen Riegel
        # ist der Ausstellungspunkt trotzdem auf BEIDEN Domains erreichbar --
        # und gate_verdict() schreibt bei jedem erlaubenden Urteil
        # last_staging_seen fort (20260818001000_gate_verdict.sql:56-63). Ein
        # regulaer angemeldeter Live-Nutzer koennte die D-13-Kennzahl "zuletzt
        # auf staging gesehen" damit verunreinigen, ohne je auf staging
        # gewesen zu sein. Kein Sicherheitsloch (mint() prueft ausschliesslich
        # das Bearer-Token des Aufrufers selbst), aber eine Kennzahl, die
        # leise falsch wird, ist schlimmer als eine, die fehlt.
        # Befund IN-01 des Code-Reviews; dort als "optional, kein Blocker"
        # eingestuft und deshalb erst jetzt behoben -- vor der Freigabe nach
        # main, ab der dieser Pfad auf verse-base.com ueberhaupt erst
        # existiert (heute antwortet live dort 404, weil das Live-Image den
        # Torcode noch nicht kennt).
        #
        # `if` in einer location ist beruechtigt, `return` ist aber einer der
        # zwei dokumentiert unbedenklichen Faelle: es beendet die Anfrage,
        # statt einen zweiten Inhaltsgeber zu erzeugen, und laesst das
        # Kopfzeilen-Erbe aus dem server-Block unberuehrt (siehe den
        # add_header-Hinweis im Kopfkommentar dieser Datei).
        if ($vb_gate_on != "1") { return 404; }
        js_content gate.mint;
    }

    # Gemessen, nicht geraten (Plan 08): playwright-core mit dem installierten
    # Chrome hat /gate.html OHNE Cookie geladen und JEDE ausgeloeste Anfrage
    # mitgeschrieben — genau diese sieben Ressourcen, keine mehr. Ergaenzt um
    # die vier Eintraege, die NICHT von der Seite selbst kommen (/build.json,
    # /robots.txt, /_gate/mint, /gate.html — siehe deren je eigene GATE-
    # AUSNAHME-Zeile an anderer Stelle dieser Datei). Kein Sammelmuster ueber
    # /assets/ oder /_astro/ (D-06 verlangt Aufzaehlung) — die einzige
    # Ausnahme davon ist ^~ /assets/fonts/ unten, ein Verzeichnis mit
    # ausschliesslich Schriftdateien. gate.js fuehrt dieselbe Liste defensiv
    # zusaetzlich in check() (EXEMPT_PATHS/EXEMPT_PREFIXES) — beide muessen
    # zusammenpassen, Plan 09 friert das in scripts/verify-gate.mjs ein.
# GATE-AUSNAHME: /gate.html — die Torseite selbst; ohne diese Ausnahme koennte niemand je hinein
    location = /gate.html {
    }
# GATE-AUSNAHME: /robots.txt — scripts/browser-smoke.mjs (Schiene C) und der Workflow-Schritt "Verify the preview is not indexable" holen diese Datei vor jedem Lauf; ohne die Ausnahme bricht der Rauchtest mit Exit 2 ab
    location = /robots.txt {
        try_files $uri =404;
    }
# GATE-AUSNAHME: /assets/theme.css — Gestaltung der Torseite, fester Pfad ohne Build-Hash, gemessen ueber einen echten Browser-Mitschnitt von /gate.html ohne Cookie
    location = /assets/theme.css {
        try_files $uri =404;
    }
# GATE-AUSNAHME: /assets/fonts.css — Schrift der Torseite, derselbe Grund wie theme.css, ebenfalls im Mitschnitt gemessen
    location = /assets/fonts.css {
        try_files $uri =404;
    }
# GATE-AUSNAHME: /assets/fonts/ — die von fonts.css referenzierten .woff2-Dateien selbst (vier im Mitschnitt gemessen); einziges erlaubtes Praefixmuster, weil das Verzeichnis AUSSCHLIESSLICH Schriftdateien enthaelt, deren Namen sich bei jedem Schriftwechsel aendern
    location ^~ /assets/fonts/ {
        try_files $uri =404;
    }

    # --- Sprach-Tausch: Englisch ist Standard und liegt auf der Wurzel ----------
    # Vorher: DE präfixlos auf der Wurzel, EN unter /en/. Jetzt umgekehrt.
    # Die alten /en/…-URLs sind indexiert und dürfen nicht ins 404 laufen — sie
    # zeigen auf exakt dieselbe (englische) Seite, die jetzt auf der Wurzel liegt,
    # also permanent umleiten und das Ranking mitnehmen.
    #   /en.html            -> /
    #   /en/schiffe/x.html  -> /schiffe/x.html
    # Die alten DEUTSCHEN URLs (/schiffe/x.html) werden NICHT umgeleitet: dort
    # liegt jetzt die englische Seite. Das ist die bewusste Konsequenz des
    # Tauschs; hreflang/x-default verweisen von dort auf /de/….
    location = /en.html { return 301 /; }
    location = /en      { return 301 /; }
    location /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    # --- Einstiegs-URLs ohne .html: erledigt die Zwillingsregel in location / --
    # /de, /account, /items, /crafting … standen hier frueher als je zwei eigene
    # `return 301`-Zeilen. Das war die Symptombehandlung einer generellen
    # format:'file'-Falle (siehe location / unten) und deckte immer nur die
    # Pfade ab, an die jemand gedacht hatte — /schiffe, /patches, /missionen,
    # /topics, /archiv, /refinery, /item-finder, /pilot liefen weiter ins
    # 403/404. Die generische Regel deckt alle ab, auch kuenftige Seiten.

    # --- Verzeichnisse OHNE .html-Zwilling -------------------------------------
    # /patches/ traegt die Patch-Seiten, eine /patches.html gibt es nicht — der
    # Hub ist das Archiv. Die Zwillingsregel kann hier also nichts finden, und
    # /patches ist genau die URL, die man bei einem „Patch-Archiv" raet.
    location = /patches     { return 301 /archiv.html; }
    location = /patches/    { return 301 /archiv.html; }
    location = /de/patches  { return 301 /de/archiv.html; }
    location = /de/patches/ { return 301 /de/archiv.html; }

    # --- Oeffentliche Piloten-Profile: /pilot/<handle> -------------------------
    # Die Profilseite ist statisch (/pilot.html bzw. /de/pilot.html,
    # build.format 'file') und laedt das Profil CLIENTSEITIG aus den Supabase-
    # Views — SSR gibt es nicht. Trotzdem sollen teilbare, sprechende URLs wie
    # /pilot/star_runner funktionieren: interner Rewrite auf die statische
    # Datei, der Handle wandert in den Query-Parameter ?h= (die Seite liest ihn
    # von dort; Fallback: sie parst location.pathname selbst). `last` startet
    # die Location-Suche mit dem umgeschriebenen URI neu, damit die Datei ueber
    # den normalen location /-Block mit try_files ausgeliefert wird.
    # Handle-Alphabet deckt sich mit dem Dashboard-Regex (a-z 0-9 _, hier
    # grosszuegiger auch A-Z und Bindestrich).
    location /de/pilot/ { rewrite ^/de/pilot/([A-Za-z0-9_-]+)/?$ /de/pilot.html?h=$1 last; }
    location /pilot/    { rewrite ^/pilot/([A-Za-z0-9_-]+)/?$ /pilot.html?h=$1 last; }

    # Static multi-page site (Astro build.format:'file' → real .html files, plus
    # directory index.html for the onepagers). No SPA rewrite — mirror the existing
    # behaviour and fall through to a real 404.
    location / {
        # Testpilot-Tor (D-06): ohne gueltigen Ausweis geht JEDE URL auf die
        # Torseite, nicht auf ein nacktes 403/404 (D-01-Strenge). $next traegt
        # das urspruengliche Ziel, damit die Torseite nach dem Anmelden dorthin
        # zurueckspringt; sie validiert den Parameter selbst (kein offener
        # Redirect, T-14-05). Auf staging.verse-base.com ist $vb_gate_ok nur
        # "0", wenn $vb_gate_on = "1" ist (Vorschau-Bau) UND kein gueltiges
        # Cookie vorliegt — auf der Live-Seite bleibt das Verhalten unveraendert
        # (D-12), weil $vb_gate_on dort fest auf "0" steht.
        if ($vb_gate_ok = "0") { return 302 /gate.html?next=$uri; }

        # --- .html-Zwillingsregel ---------------------------------------------
        # build.format:'file' legt JEDE Seite als Datei ab (/schiffe.html) und
        # daneben oft ein GLEICHNAMIGES Verzeichnis mit den Unterseiten
        # (/schiffe/<slug>.html). Wer die naheliegende URL /schiffe tippt — oder
        # sie aus einem Chat abschreibt —, bekam bisher ein nacktes nginx-403:
        # try_files fiel auf $uri/ zurueck, fand das Verzeichnis, das hat keine
        # index.html und autoindex ist aus. Existiert die .html-Datei, ist SIE
        # die kanonische URL, also 301 dorthin (Query-String mitnehmen).
        # Beide Formen treffen dieselbe Datei, weil $vb_base den Schrägstrich am
        # Ende abschneidet: /schiffe und /schiffe/ -> /schiffe.html.
        # Die Onepager (/onepager/<name>/ mit echter index.html) haben KEINE
        # .html-Zwillingsdatei — fuer sie greift die Regel nicht, sie laufen
        # unveraendert ueber try_files.
        # `return` innerhalb von `if` ist die dokumentiert unbedenkliche
        # if-Verwendung (nginx: "If is Evil" — return/rewrite…last sind sicher).
        if (-f $document_root$vb_base.html) {
            return 301 $vb_base.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }

    # Astro emits /404.html; serve it with a genuine 404 status (not 200).
    error_page 404 /404.html;

    # Ein Verzeichnis ohne index.html und ohne .html-Zwilling (z. B. /topics/,
    # /onepager/) liefert sonst nginx' nackte 403-Seite — fuer den Besucher
    # sieht das nach „gesperrt"/kaputt aus, obwohl es schlicht nichts gibt.
    # `=404` setzt den Status um; ohne das Gleichheitszeichen bliebe es ein 403
    # mit 404-Inhalt.
    error_page 403 =404 /404.html;
}
