# Review-Nachweis: setzt den Status `review-nachweis` auf den Head-Commit
# jedes PRs nach staging oder main. Gruen nur, wenn ein abgeschlossener
# KI-Review GENAU diesen Stand lueckenlos abdeckt (kritische PRs: zwei, oder
# einer plus Krisz' dokumentierte Ausnahme; Releases: jeder enthaltene PR mit
# Nachweis). Regeln und Ablauf: docs/review-workflow.md. Das Urteil faellt
# scripts/lib/review-nachweis.mjs, getestet in tests/e2e/review-nachweis.test.js.
#
# Welche Auswertung laeuft: die aus dem ZIELZWEIG (Spitze von staging bzw.
# main, ueber die API geholt), nicht die aus dem PR. Ein PR, der das Gate
# aendert, wird so noch nach den alten Regeln beurteilt; seine Aenderung
# wirkt erst nach dem Merge. Nur wenn der Zielzweig die Auswertung noch
# nicht kennt (HTTP 404: der erste PR, der sie einfuehrt), laeuft die aus
# dem PR, und der Bericht sagt das. Jeder andere Fehler beim Holen bricht
# ab, statt still auf die Fassung des PRs auszuweichen.
# Kein Checkout: das Repo ist ueber 2 GB gross (fast zwei Minuten je
# Ereignis), und so liegt kein Code aus dem PR auf dem Runner.
# Grenze: diese Datei selbst kommt bei `pull_request` aus dem PR. Deshalb
# zaehlt jede Aenderung unter .github/ als kritisch (zwei Pruefungen oder
# Krisz' Freigabe). Ausgefuehrt wird kein Code aus dem PR ausser im
# genannten Erstfall; Fork-PRs laufen gar nicht (kein Schreibrecht, kein
# Status, also kein Merge ohne Krisz).
#
# Warten: Das Ende eines CodeRabbit-Reviews ohne Kommentare loest kein
# Ereignis aus. Ist ein Review angefordert, wartet der Lauf deshalb bis zu
# 40 Minuten darauf (oeffentliches Repo: Actions-Minuten kosten nichts).
# Jedes neue Ereignis bricht den wartenden Lauf ab und startet neu.
name: Review-Nachweis

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: review-nachweis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nachweis:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read # Auswertung aus dem Zielzweig holen
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Auswertung aus dem Zielzweig holen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ZIEL: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          hole() {
            mkdir -p "$(dirname "$RUNNER_TEMP/gate/$1")"
            curl -sS --retry 3 -o "$RUNNER_TEMP/gate/$1" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
              "https://api.github.com/repos/$REPO/contents/$1?ref=$2"
          }
          code=$(hole scripts/lib/review-nachweis.mjs "$ZIEL")
          if [ "$code" = 200 ]; then
            REF="$ZIEL"; QUELLE="Zielzweig ($ZIEL)"
          elif [ "$code" = 404 ]; then
            REF="$PR_HEAD"; QUELLE="diesem PR (Erstfall: Zielzweig kennt das Gate noch nicht)"
          else
            echo "::error::Auswertung im Zielzweig nicht abrufbar (HTTP $code)"; exit 1
          fi
          for f in scripts/lib/review-nachweis.mjs scripts/review-nachweis.mjs; do
            code=$(hole "$f" "$REF")
            [ "$code" = 200 ] || { echo "::error::$f nicht abrufbar (HTTP $code)"; exit 1; }
          done
          echo "QUELLE=$QUELLE" >> "$GITHUB_ENV"
      - name: Nachweis bewerten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          EREIGNIS: ${{ github.event_name }}
          AKTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FREIGABE_KONTEN: cibakhun
        run: node "$RUNNER_TEMP/gate/scripts/review-nachweis.mjs"
