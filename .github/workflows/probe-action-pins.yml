# Sonde, kein Tor (wie probe-njs.yml). Beantwortet EINE Frage: auf welchen
# Commit zeigen die Versions-Tags der Actions, die dieses Repo benutzt, HEUTE?
# Das Ergebnis steht im Protokoll unter "Set up job" in den Zeilen
# "Download action repository '<name>@<tag>' (SHA:<commit>)".
#
# Die Schritte stehen alle auf `if: false`: der Runner laedt jede Action
# einer Job-Definition schon beim Einrichten herunter und loest dabei den Tag
# auf, ausgefuehrt wird keine. Darum ist die Sonde harmlos, auch fuer
# delete-package-versions.
#
# LEBENSDAUER: nur fuer das Festnageln der Actions auf Commit-SHAs. Danach
# haelt Dependabot (.github/dependabot.yml) die Pins aktuell, und die Datei
# verschwindet wieder.
name: Sonde — Action-Pins aufloesen

on:
  push:
    branches:
      - 'claude/project-thread-2dat5l'
    paths:
      - '.github/workflows/probe-action-pins.yml'

permissions: {}

jobs:
  kern:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ergebnis steht unter 'Set up job'."
      - if: false
        uses: actions/checkout@v4
      - if: false
        uses: actions/setup-node@v4
      - if: false
        uses: actions/upload-artifact@v4
      - if: false
        uses: actions/download-artifact@v4
      - if: false
        uses: actions/delete-package-versions@v5
      - if: false
        uses: docker/login-action@v3
      - if: false
        uses: docker/build-push-action@v6
      - if: false
        uses: actions/dependency-review-action@v4

  codeql-v4:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ergebnis steht unter 'Set up job'."
      - if: false
        uses: github/codeql-action/init@v4
      - if: false
        uses: github/codeql-action/analyze@v4

  codeql-v3:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ergebnis steht unter 'Set up job'."
      - if: false
        uses: github/codeql-action/init@v3
      - if: false
        uses: github/codeql-action/analyze@v3
