# Baut die Seite in GitHub Actions (viel RAM) als Docker-Image und pusht es nach
# ghcr.io. Coolify zieht das fertige Image -> kein Build auf dem Server (OOM).
#
# VIER JOBS, JEDER MIT NUR DEM RECHT, DAS ER BRAUCHT:
#   build    build-site-image.yml — baut, prueft (Indexierbarkeit, Browser-
#            Rauchtest) und sichert das Image als Artefakt. Nur Leserecht,
#            kein Secret: hier laeuft fremder npm-Code auf dem Runner.
#   publish  frische Maschine, laedt das Artefakt, vergleicht die Image-ID mit
#            der direkt nach dem Bau festgehaltenen und schiebt erst dann.
#            Kein npm, kein Checkout.
#   prune    raeumt alte Paketversionen auf; darf nie rot faerben.
#   deploy   Umgebung `production`: nur hier sind die Coolify-Secrets
#            erreichbar, sobald sie dort statt im Repo liegen. Die Umgebung
#            kann auf den Zweig main beschraenkt werden.
#
# Das wirkt nur so weit wie der Token reicht: ein Coolify-API-Token gilt fuer
# sein ganzes Team, nicht fuer eine Anwendung. Fuer eine echte Trennung laufen
# Vorschau und Bot in einem eigenen Coolify-Team mit eigenem Token (Secret
# COOLIFY_API_TOKEN je Umgebung). COOLIFY_PIN_IMAGE_TAG (braucht Recht
# "write") nur als Variable der Umgebung `production` setzen.
name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-site-image.yml
    with:
      staging: false
      tags: |
        ghcr.io/cibakhun/sc-patch-archive:latest
        ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}
      artifact: site-image

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image-Artefakt holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-image
          path: ${{ runner.temp }}/image

      # Kein Checkout in diesem Job, deshalb steht die Pruefung hier im
      # Workflow und nicht in .github/scripts/. Verglichen wird JEDES Tag:
      # ein Artefakt, das unter :latest das gepruefte und unter dem
      # Commit-Tag ein anderes Image traegt, faellt genauso auf.
      - name: Laden und mit dem gebauten Image vergleichen
        env:
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
          TAGS: |
            ghcr.io/cibakhun/sc-patch-archive:latest
            ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}
        run: |
          zstd -d -q -c "$RUNNER_TEMP/image/image.tar.zst" | docker load
          mapfile -t ALL < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d;s/^[[:space:]]*//;s/[[:space:]]*$//')
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::Keine Image-ID vom Bau-Job erhalten ('$IMAGE_ID')."; exit 1 ;; esac
          for t in "${ALL[@]}"; do
            HAVE=$(docker image inspect --format '{{.Id}}' "$t")
            if [ "$HAVE" != "$IMAGE_ID" ]; then
              echo "::error::$t ist nicht das gepruefte Image ($HAVE statt $IMAGE_ID) — es wird nichts geschoben."; exit 1
            fi
            echo "OK $t = $IMAGE_ID"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (erst nach bestandenen Pruefungen)
        run: |
          docker push ghcr.io/cibakhun/sc-patch-archive:latest
          docker push ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}

  # Aufbewahrung begrenzen: jede Paketversion haelt ihre Layer (~700 MB
  # unkomprimiert) fest, ohne Aufraeumen waechst das Paket unbegrenzt.
  # Im selben Paket liegen Live-Images (Tag = Commit) und die Vorschau-Images
  # aus deploy-staging.yml (Tag staging-<Commit>). Bis 09.11.2026 hiess die
  # Regel "die 10 neuesten Versionen bleiben"; zwischen zwei Releases
  # entstehen aber mehr als zehn Vorschau-Images, und Lauf 42553428500
  # loeschte das vorige Live-Image 6bb4ade6 in derselben Minute, in der
  # 6c134200 live ging. Jetzt getrennt: die 5 neuesten Live-Images und die
  # 10 neuesten Vorschau-Images bleiben, latest und staging immer.
  # Regeln und Gruende: .github/scripts/ghcr-aufraeumen.mjs, Beispiele in
  # tests/e2e/ghcr-aufraeumen.test.js.
  # continue-on-error: das Aufraeumen darf einen erfolgreichen Deploy nie
  # nachtraeglich rot faerben.
  prune:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/ghcr-aufraeumen.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Alte Paketversionen aufraeumen (Live-Images getrennt gezaehlt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/ghcr-aufraeumen.mjs \
            --owner ${{ github.repository_owner }} \
            --paket sc-patch-archive \
            --live 5 \
            --staging 10 \
            --schonen ${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      # Nur die zwei Dateien, die dieser Job ausfuehrt — kein npm ci, also
      # auch kein fremder Paketcode neben den Coolify-Secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/coolify-deploy.sh
            scripts/check-deployed.mjs
            scripts/check-headers.mjs
            scripts/lib/csp-inline.mjs

      # Coolify anstossen, das neue Image zu ziehen. Ablauf, Fehlermeldungen
      # und die Gruende fuer Trimmen und Zeitgrenzen: .github/scripts/coolify-deploy.sh.
      # Optional (Repo-/Umgebungsvariable COOLIFY_PIN_IMAGE_TAG=true): vorher
      # die Anwendung auf den unveraenderlichen Tag dieses Commits umstellen.
      - name: Trigger Coolify redeploy
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          LABEL: live
          PIN_TAG: ${{ vars.COOLIFY_PIN_IMAGE_TAG == 'true' && github.sha || '' }}
        run: bash .github/scripts/coolify-deploy.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Wie in deploy-staging.yml: warten, bis die LIVE-Seite den frisch
      # gebauten Stand wirklich ausliefert. "CI gruen" ist keine Antwort
      # darauf — siehe die Begruendung dort. Sperrt Cloudflare /build.json,
      # liest der Schritt denselben Stempel aus /build.txt.
      - name: Warten, bis die Live-Seite den neuen Stand zeigt
        run: |
          node scripts/check-deployed.mjs \
            --base https://verse-base.com \
            --sha ${{ github.sha }} \
            --live \
            --weich \
            --warte 600

      # KEIN Kopfzeilen-Schritt hier. Er stand bis zum 01.11.2026 an dieser
      # Stelle (check-headers.mjs --weich) und hat den Deploy von f602fb3b rot
      # gefaerbt, OBWOHL er gelandet war: Coolify-Anstoss und der Warte-Schritt
      # darueber waren gruen, die Seite lieferte den neuen Stand.
      #
      # `--weich` entschuldigt nur Stichproben, die GAR NICHT durchkommen.
      # Cloudflare sperrt den Runner vor verse-base.com aber nicht bloss, es
      # ANTWORTET auch selbst: in Lauf 41294060039 waren 10 von 14 Stichproben
      # HTTP 403, und die vier mit 200 kamen vom Cloudflare-Rand, nicht von
      # unserem nginx — ohne Permissions-Policy, ohne COOP, mit 'unsafe-inline'
      # in der Richtlinie. Daraus machte der Pruefer die Meldung "nginx steht
      # auf dem Rueckfall, die Hash-Dateien fehlen im Image". Alle drei Befunde
      # waren falsch: vom Entwicklungsrechner aus trugen dieselben Adressen
      # (/, /assets/theme.css, /robots.txt, /build.json) die Hash-Richtlinie
      # und beide Kopfzeilen.
      #
      # Ein Pruefer, der sein Pruefobjekt nicht erreicht, kann darueber nicht
      # urteilen; ein Daueralarm erzieht dazu, Rot zu uebersehen (Grundsatz 3:
      # Fehlalarme sind teurer als Luecken). Das Urteil liegt deshalb auf
      # Schiene C, vom Entwicklungsrechner aus und streng:
      #     npm run check:headers:live
      # CLAUDE.md fuehrt das als Pflicht vor der Fertig-Meldung.
      #
      # In deploy-staging.yml bleibt der Schritt (5 von 5 Laeufen gruen,
      # gemessen 01.11.2026). Der Grund stand hier bis zum 08.11.2026 falsch:
      # staging.verse-base.com hat denselben Bot-Schutz, auch dort bekommt der
      # Runner fuer HTML und .json 403 (Protokoll vom 01.11. ebenso). Durch
      # kommen nur Stichproben mit statischer Endung, und die tragen dort die
      # Kopfzeilen des Ursprungs. Faengt er auch dort an, falsch rot zu
      # werden, gehoert er auch dort weg — nicht auf "immer gruen" gestellt.
