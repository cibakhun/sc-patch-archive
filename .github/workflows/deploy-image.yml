# Baut die Seite in GitHub Actions (viel RAM) als Docker-Image und pusht es nach
# ghcr.io. Coolify zieht das fertige Image -> kein Build auf dem Server (OOM).
name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Das Qualitaetstor (e2e-Tests + Link-Integritaet) steckt im Dockerfile,
      # NICHT als eigener Schritt hier: dort existiert dist/ bereits, ein
      # Schritt an dieser Stelle muesste die Seite ein zweites Mal bauen.
      # Schlaegt es fehl, bricht dieser Build ab und es wird nichts gepusht.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cibakhun/sc-patch-archive:latest
            ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}

      # Aufbewahrung begrenzen: jeder Push auf main legt eine neue Paketversion
      # an, und jede haelt ihre Layer (~700 MB unkomprimiert) fest. Ohne
      # Aufraeumen waechst das Paket unbegrenzt. Die 10 neuesten bleiben — das
      # deckt einen Rollback ueber mehrere Deploys ab; aelteres ist praktisch
      # unerreichbar, weil Coolify ueber :latest zieht.
      # continue-on-error: das Aufraeumen darf einen erfolgreichen Deploy nie
      # nachtraeglich rot faerben.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: sc-patch-archive
          package-type: container
          min-versions-to-keep: 10

      # Coolify anstoßen, das neue Image zu ziehen (Webhook-URL + API-Token als Repo-Secrets).
      # Der Deploy-Webhook braucht einen Bearer-Token (COOLIFY_API_TOKEN, Permission "deploy").
      # Ist eins von beiden nicht gesetzt, wird nur ein Hinweis geloggt —
      # dann in Coolify manuell "Redeploy" klicken.
      - name: Trigger Coolify redeploy
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$HOOK" ] && [ -n "$TOKEN" ]; then
            curl -fsSL "$HOOK" -H "Authorization: Bearer $TOKEN" && echo "Coolify redeploy triggered."
          else
            echo "COOLIFY_DEPLOY_WEBHOOK und/oder COOLIFY_API_TOKEN nicht gesetzt — redeploy manuell in Coolify."
          fi
