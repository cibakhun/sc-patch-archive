# Baut die Seite in GitHub Actions (viel RAM) als Docker-Image und pusht es nach
# ghcr.io. Coolify zieht das fertige Image -> kein Build auf dem Server (OOM).
#
# VIER JOBS, JEDER MIT NUR DEM RECHT, DAS ER BRAUCHT:
#   build    build-site-image.yml — baut, prueft (Indexierbarkeit, Browser-
#            Rauchtest) und sichert das Image als Artefakt. Nur Leserecht,
#            kein Secret: hier laeuft fremder npm-Code auf dem Runner.
#   publish  frische Maschine, laedt das Artefakt, vergleicht die Image-ID mit
#            der direkt nach dem Bau festgehaltenen und schiebt erst dann.
#            Kein npm, kein Checkout.
#   prune    raeumt alte Paketversionen auf; darf nie rot faerben.
#   deploy   Umgebung `production`: nur hier sind die Coolify-Secrets
#            erreichbar, sobald sie dort statt im Repo liegen. Die Umgebung
#            kann auf den Zweig main beschraenkt werden.
#
# Das wirkt nur so weit wie der Token reicht: ein Coolify-API-Token gilt fuer
# sein ganzes Team, nicht fuer eine Anwendung. Fuer eine echte Trennung laufen
# Vorschau und Bot in einem eigenen Coolify-Team mit eigenem Token (Secret
# COOLIFY_API_TOKEN je Umgebung). COOLIFY_PIN_IMAGE_TAG (braucht Recht
# "write") nur als Variable der Umgebung `production` setzen.
name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-site-image.yml
    with:
      staging: false
      tags: |
        ghcr.io/cibakhun/sc-patch-archive:latest
        ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}
      artifact: site-image

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image-Artefakt holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-image
          path: ${{ runner.temp }}/image

      # Kein Checkout in diesem Job, deshalb steht die Pruefung hier im
      # Workflow und nicht in .github/scripts/. Verglichen wird JEDES Tag:
      # ein Artefakt, das unter :latest das gepruefte und unter dem
      # Commit-Tag ein anderes Image traegt, faellt genauso auf.
      - name: Laden und mit dem gebauten Image vergleichen
        env:
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
          TAGS: |
            ghcr.io/cibakhun/sc-patch-archive:latest
            ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}
        run: |
          zstd -d -q -c "$RUNNER_TEMP/image/image.tar.zst" | docker load
          mapfile -t ALL < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d;s/^[[:space:]]*//;s/[[:space:]]*$//')
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::Keine Image-ID vom Bau-Job erhalten ('$IMAGE_ID')."; exit 1 ;; esac
          for t in "${ALL[@]}"; do
            HAVE=$(docker image inspect --format '{{.Id}}' "$t")
            if [ "$HAVE" != "$IMAGE_ID" ]; then
              echo "::error::$t ist nicht das gepruefte Image ($HAVE statt $IMAGE_ID) — es wird nichts geschoben."; exit 1
            fi
            echo "OK $t = $IMAGE_ID"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (erst nach bestandenen Pruefungen)
        run: |
          docker push ghcr.io/cibakhun/sc-patch-archive:latest
          docker push ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}

  # Aufbewahrung begrenzen: jeder Push auf main legt eine neue Paketversion
  # an, und jede haelt ihre Layer (~700 MB unkomprimiert) fest. Ohne
  # Aufraeumen waechst das Paket unbegrenzt. Die 10 neuesten bleiben — das
  # deckt einen Rollback ueber mehrere Deploys ab.
  # continue-on-error: das Aufraeumen darf einen erfolgreichen Deploy nie
  # nachtraeglich rot faerben.
  prune:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: sc-patch-archive
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      # Nur die zwei Dateien, die dieser Job ausfuehrt — kein npm ci, also
      # auch kein fremder Paketcode neben den Coolify-Secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/coolify-deploy.sh
            scripts/check-deployed.mjs

      # Coolify anstossen, das neue Image zu ziehen. Ablauf, Fehlermeldungen
      # und die Gruende fuer Trimmen und Zeitgrenzen: .github/scripts/coolify-deploy.sh.
      # Optional (Repo-/Umgebungsvariable COOLIFY_PIN_IMAGE_TAG=true): vorher
      # die Anwendung auf den unveraenderlichen Tag dieses Commits umstellen.
      - name: Trigger Coolify redeploy
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          LABEL: live
          PIN_TAG: ${{ vars.COOLIFY_PIN_IMAGE_TAG == 'true' && github.sha || '' }}
        run: bash .github/scripts/coolify-deploy.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Wie in deploy-staging.yml: warten, bis die LIVE-Seite den frisch
      # gebauten Stand wirklich ausliefert. "CI gruen" ist keine Antwort
      # darauf — siehe die Begruendung dort.
      - name: Warten, bis die Live-Seite den neuen Stand zeigt
        run: |
          node scripts/check-deployed.mjs \
            --base https://verse-base.com \
            --sha ${{ github.sha }} \
            --live \
            --weich \
            --warte 600
