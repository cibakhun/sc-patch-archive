# Baut die Seite in GitHub Actions (viel RAM) als Docker-Image und pusht es nach
# ghcr.io. Coolify zieht das fertige Image -> kein Build auf dem Server (OOM).
name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Das Qualitaetstor (e2e-Tests + Link-Integritaet) steckt im Dockerfile,
      # NICHT als eigener Schritt hier: dort existiert dist/ bereits, ein
      # Schritt an dieser Stelle muesste die Seite ein zweites Mal bauen.
      # Schlaegt es fehl, bricht dieser Build ab und es wird nichts gepusht.
      # Erst BAUEN, nicht pushen — zwischen Build und Push liegen zwei
      # Pruefungen am fertigen Image (Indexierbarkeit + Browser-Rauchtest).
      # Gleiche Reihenfolge wie in deploy-staging.yml; was nicht besteht,
      # wird nie veroeffentlicht.
      - name: Build (noch nicht pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/cibakhun/sc-patch-archive:latest
            ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}

      # Gegenprobe im fertigen Image — das SPIEGELBILD der Pruefung in
      # deploy-staging.yml. Dort wird belegt, dass die Vorschau gesperrt ist;
      # hier, dass die Live-Seite es NICHT ist. Anlass (09.08.2026): ein
      # Live-Build, der versehentlich mit STAGING=1 entsteht, traegt eine
      # sperrende robots.txt und site-weites noindex — er wuerde tadellos
      # deployen und die ganze Domain aus dem Index nehmen, ohne dass etwas
      # bricht. Genau der Ausfallmodus, den kein Test faengt: die Seite baut,
      # laedt und funktioniert, sie ist nur unsichtbar.
      - name: Verify the live image IS indexable
        run: |
          CID=$(docker create ghcr.io/cibakhun/sc-patch-archive:latest)
          docker cp "$CID:/usr/share/nginx/html/robots.txt" ./robots.check
          docker cp "$CID:/usr/share/nginx/html/index.html" ./index.check
          docker cp "$CID:/usr/share/nginx/html/sitemap.xml" ./sitemap.check
          docker rm "$CID" >/dev/null
          echo "--- robots.txt ---"; cat ./robots.check
          # ⚠ Verneinende Pruefungen als `if`, NICHT als `grep -q … && exit 1`.
          # Nachgemessen: unter `bash -e` ist eine solche UND-Liste MITTEN im
          # Skript harmlos (das fehlgeschlagene grep ist von errexit
          # ausgenommen) — steht sie aber als LETZTE Zeile, wird ihr Status 1
          # zum Status des Schritts, und der Deploy reisst genau dann, wenn
          # alles in Ordnung ist. Eine Zeile, die je nach ihrer POSITION das
          # Gegenteil bedeutet, gehoert nicht in ein Tor. Im `if`-Kopf gilt
          # errexit ohnehin nicht.
          if grep -qE '^Disallow: /$' ./robots.check; then
            echo "FEHLER: robots.txt sperrt die LIVE-Seite (versehentlich ein STAGING-Build?)"; exit 1
          fi
          if grep -q 'name="robots" content="noindex"' ./index.check; then
            echo "FEHLER: die Startseite traegt noindex."; exit 1
          fi
          grep -q '<loc>' ./sitemap.check || { echo "FEHLER: der Sitemap-Index bewirbt nichts."; exit 1; }
          echo "OK — die Live-Seite ist indexierbar."

      # ---- Browser-Rauchtest gegen den LAUFENDEN Container ----------------
      # Dieselbe Begruendung wie in deploy-staging.yml: node:22-alpine hat
      # keinen Browser, und die CSP ist ein nginx-Header, den es nur im
      # laufenden Container gibt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Browser bereitstellen
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v $c)" >> "$GITHUB_ENV"
              echo "gefunden: $(command -v $c)"; exit 0
            fi
          done
          echo "kein Browser vorinstalliert — chromium wird nachinstalliert"
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
          echo "CHROME_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Rauchtest gegen das fertige Image
        run: |
          docker run -d --rm -p 8080:80 --name smoke ghcr.io/cibakhun/sc-patch-archive:latest
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          code=0
          node scripts/browser-smoke.mjs --base http://localhost:8080 || code=$?
          docker stop smoke >/dev/null || true
          exit $code

      - name: Push (erst nach bestandenen Pruefungen)
        run: |
          docker push ghcr.io/cibakhun/sc-patch-archive:latest
          docker push ghcr.io/cibakhun/sc-patch-archive:${{ github.sha }}

      # Aufbewahrung begrenzen: jeder Push auf main legt eine neue Paketversion
      # an, und jede haelt ihre Layer (~700 MB unkomprimiert) fest. Ohne
      # Aufraeumen waechst das Paket unbegrenzt. Die 10 neuesten bleiben — das
      # deckt einen Rollback ueber mehrere Deploys ab; aelteres ist praktisch
      # unerreichbar, weil Coolify ueber :latest zieht.
      # continue-on-error: das Aufraeumen darf einen erfolgreichen Deploy nie
      # nachtraeglich rot faerben.
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: sc-patch-archive
          package-type: container
          min-versions-to-keep: 10

      # Coolify anstoßen, das neue Image zu ziehen (Webhook-URL + API-Token als Repo-Secrets).
      # Der Deploy-Webhook braucht einen Bearer-Token (COOLIFY_API_TOKEN, Permission "deploy").
      # Ist eins von beiden nicht gesetzt, wird nur ein Hinweis geloggt —
      # dann in Coolify manuell "Redeploy" klicken.
      # Rand-Leerraum wird abgeschnitten: ein an den Secret-Wert geratenes Zeilenende
      # macht den Bearer-Header ungueltig (401), ohne dass man es dem Log ansieht —
      # `curl -f` verschluckt den Rumpf. Siehe deploy-staging.yml, 14.08.2026.
      - name: Trigger Coolify redeploy
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$TOKEN" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK und/oder COOLIFY_API_TOKEN nicht gesetzt — redeploy manuell in Coolify."
            exit 0
          fi
          CLEAN_TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          echo "Token: ${#TOKEN} Zeichen roh, ${#CLEAN_TOKEN} nach dem Trimmen (Wert wird nicht ausgegeben)."
          CLEAN_HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]')
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' "$CLEAN_HOOK" -H "Authorization: Bearer $CLEAN_TOKEN")
          echo "HTTP $CODE"
          echo "Antwort: $(head -c 400 "$BODY")"
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "Coolify redeploy triggered."
          else
            echo "::error::Coolify lehnt den Deploy-Aufruf ab (HTTP $CODE). Bei 401: Token in Coolify unter Keys & Tokens pruefen (Berechtigung 'deploy') und COOLIFY_API_TOKEN ohne Zeilenende neu setzen."
            exit 1
          fi

      # Wie in deploy-staging.yml: warten, bis die LIVE-Seite den frisch
      # gebauten Stand wirklich ausliefert. "CI gruen" ist keine Antwort
      # darauf — siehe die Begruendung dort.
      - name: Warten, bis die Live-Seite den neuen Stand zeigt
        run: |
          node scripts/check-deployed.mjs \
            --base https://verse-base.com \
            --sha ${{ github.sha }} \
            --live \
            --weich \
            --warte 600
