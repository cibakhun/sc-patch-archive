# Spielermarkt-Mitschrieb (scripts/track-marketplace.mjs).
#
# ⚠ DER ZEITPLAN IST BEWUSST AUS. GRUND, GEMESSEN AM 02.08.2026:
# UEX steht hinter Cloudflare-Bot-Schutz. Aus GitHub Actions heraus antwortet
# JEDER Endpunkt mit HTTP 403 und der Challenge-Seite „Just a moment…" —
# /commodities, /terminals, /items_prices_all, /marketplace_listings, auch mit
# gesetztem Browser-User-Agent. Das ist eine IP-Sperre gegen Rechenzentren, kein
# fehlender Schluessel; ein API-Token wuerde daran nichts aendern. Der Bot-Schutz
# wird nicht umgangen.
#
# Konsequenz: Der Mitschrieb gehoert auf einen Rechner mit gewoehnlicher IP.
#   - kurzfristig: `npm run track:marketplace` lokal (Aufgabenplanung/cron)
#   - dauerhaft:   auf dem eigenen Server (Coolify/Hetzner) — vorher pruefen,
#                  ob Cloudflare dessen IP durchlaesst; Hetzner kann ebenso
#                  betroffen sein
#   - sauberste Loesung: UEX um regulaeren API-Zugang fuer die Seite bitten
#
# Die Datei bleibt liegen, damit der Befund dokumentiert ist und der Zeitplan
# sofort reaktiviert werden kann, falls der Zugang geklaert ist: dann die
# auskommentierten `schedule`-Zeilen wieder aktivieren.
#
# Der Handstart unten laeuft weiterhin — er ist der Nachweis, ob sich am
# Zugang etwas geaendert hat. Bei 403 schlaegt der Lauf jetzt ROT fehl
# (frueher gruen trotz Nulleffekt).
#
# EINRICHTUNG des Datenzweigs (schon geschehen, hier zur Nachvollziehbarkeit):
#   Zweig data/marketplace-log traegt allein marketplace-log.json. Er liegt
#   getrennt, weil deploy-staging.yml und deploy-image.yml bei JEDEM Push auf
#   staging bzw. main feuern und kein paths-ignore kennen — ein taeglicher
#   Daten-Commit dorthin baute die komplette Seite jedes Mal neu.
name: Track Marketplace

on:
  # schedule:
  #   - cron: '17 4 * * *'   # AUS: siehe Cloudflare-Befund im Kopf dieser Datei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-marketplace
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      # 1) Das Repo wegen des Skripts.
      - uses: actions/checkout@v4

      # 2) Der Datenzweig separat, damit Skript und Bestand sich nicht in die
      #    Quere kommen.
      - uses: actions/checkout@v4
        with:
          ref: data/marketplace-log
          path: .datastore

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Schlaegt bei Cloudflare-403 bewusst fehl, statt gruen durchzulaufen.
      - name: Spielermarkt abrufen und fortschreiben
        env:
          MARKETPLACE_LOG: ${{ github.workspace }}/.datastore/marketplace-log.json
        run: node scripts/track-marketplace.mjs

      - name: Bestand zurueckschreiben
        working-directory: .datastore
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace-log.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung — nichts zu committen."
            exit 0
          fi
          git commit -m "chore(marketplace): Mitschrieb $(date -u +%Y-%m-%d)"
          git push
