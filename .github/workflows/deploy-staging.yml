# Vorschau-Build. Gleiche Maschinerie wie deploy-image.yml (der Build braucht
# viel RAM und laeuft deshalb hier statt auf dem Server), aber:
#   - Zweig `staging` statt `main`
#   - Image-Tag `:staging` statt `:latest`
#   - STAGING=1 im Build -> ganze Seite noindex + robots Disallow + sichtbare
#     Marke (siehe src/lib/seo.ts#IS_STAGING)
#   - eigener Coolify-Webhook, damit die Live-App unberuehrt bleibt
#
# EINRICHTUNG (einmalig, ausserhalb dieses Repos):
#   1. Coolify: zweite Anwendung anlegen, Quelle ghcr.io/cibakhun/sc-patch-archive:staging,
#      eigene Domain (z. B. staging.verse-base.com).
#   2. Deren Deploy-Webhook als Repo-Secret COOLIFY_STAGING_WEBHOOK hinterlegen.
#      COOLIFY_API_TOKEN wird mit der Live-Pipeline geteilt.
#   3. Zweig anlegen und pushen: git switch -c staging && git push -u origin staging
#
# ABLAUF danach: PR -> in `staging` mergen -> ansehen -> in `main` mergen.
name: Build & Push Staging Image

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-image-build
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst BAUEN, nicht pushen: zwischen Build und Push liegen zwei
      # Pruefungen am fertigen Image. Was nicht besteht, wird nie
      # veroeffentlicht — dieselbe Logik wie beim Tor im Dockerfile, eine
      # Stufe spaeter.
      - name: Build (noch nicht pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            STAGING=1
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/cibakhun/sc-patch-archive:staging
            ghcr.io/cibakhun/sc-patch-archive:staging-${{ github.sha }}

      # Gegenprobe im fertigen Image: eine versehentlich indexierbare Kopie der
      # Seite waere Duplicate Content gegen die eigene Domain. Lieber hier hart
      # scheitern als es in der Search Console entdecken.
      - name: Verify the preview is not indexable
        run: |
          CID=$(docker create ghcr.io/cibakhun/sc-patch-archive:staging)
          docker cp "$CID:/usr/share/nginx/html/robots.txt" ./robots.check
          docker cp "$CID:/usr/share/nginx/html/index.html" ./index.check
          docker rm "$CID" >/dev/null
          echo "--- robots.txt ---"; cat ./robots.check
          grep -q '^Disallow: /' ./robots.check || { echo "FEHLER: robots.txt sperrt nicht."; exit 1; }
          grep -q 'name="robots" content="noindex"' ./index.check || { echo "FEHLER: index.html hat kein noindex."; exit 1; }
          echo "OK — Vorschau ist gesperrt."

      # ---- Browser-Rauchtest gegen den LAUFENDEN Container ----------------
      # Warum hier und nicht im Dockerfile-Tor: node:22-alpine hat keinen
      # Browser, und die Content-Security-Policy ist ein nginx-HEADER — sie
      # existiert erst, wenn der Container laeuft. dist/ als Dateibaum kann
      # sie nicht zeigen. Geprueft wird damit genau das Artefakt, das gleich
      # ausgeliefert wird.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Browser bereitstellen
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v $c)" >> "$GITHUB_ENV"
              echo "gefunden: $(command -v $c)"; exit 0
            fi
          done
          echo "kein Browser vorinstalliert — chromium wird nachinstalliert"
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
          echo "CHROME_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Rauchtest gegen das fertige Image
        run: |
          docker run -d --rm -p 8080:80 --name smoke ghcr.io/cibakhun/sc-patch-archive:staging
          # auf nginx warten, statt blind zu schlafen
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          # `|| code=$?`, damit der Container auch nach einem Fehlschlag
          # gestoppt wird — unter `bash -e` bricht der Schritt sonst sofort ab
          # und laesst ihn stehen. Der Exit-Code bleibt der des Rauchtests.
          code=0
          node scripts/browser-smoke.mjs --base http://localhost:8080 || code=$?
          docker stop smoke >/dev/null || true
          exit $code

      - name: Push (erst nach bestandenen Pruefungen)
        run: |
          docker push ghcr.io/cibakhun/sc-patch-archive:staging
          docker push ghcr.io/cibakhun/sc-patch-archive:staging-${{ github.sha }}

      - name: Trigger Coolify redeploy (staging)
        env:
          HOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$HOOK" ] && [ -n "$TOKEN" ]; then
            curl -fsSL "$HOOK" -H "Authorization: Bearer $TOKEN" && echo "Coolify staging redeploy triggered."
          else
            echo "COOLIFY_STAGING_WEBHOOK und/oder COOLIFY_API_TOKEN nicht gesetzt — redeploy manuell in Coolify."
          fi

      # Warten, bis die Vorschau den frisch gebauten Stand WIRKLICH ausliefert.
      # "Image gepusht" und "Coolify angestossen" sind keine Antwort darauf:
      # am 08.08.2026 lieferte staging knapp vier Stunden den Vortagsstand aus,
      # und an anderem Tag hing Coolify 20 Minuten in der Warteschlange. Ohne
      # diesen Schritt endet der Workflow gruen, waehrend die Seite alt bleibt.
      # Die Kennung kommt aus dem Build-Stempel dist/build.json.
      - name: Warten, bis die Vorschau den neuen Stand zeigt
        run: |
          node scripts/check-deployed.mjs \
            --base https://staging.verse-base.com \
            --sha ${{ github.sha }} \
            --vorschau \
            --warte 600
