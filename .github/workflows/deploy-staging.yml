# Vorschau-Build. Gleiche Maschinerie wie deploy-image.yml (der Build braucht
# viel RAM und laeuft deshalb hier statt auf dem Server), aber:
#   - Zweig `staging` statt `main`
#   - Image-Tag `:staging` statt `:latest`
#   - STAGING=1 im Build -> ganze Seite noindex + robots Disallow + sichtbare
#     Marke (siehe src/lib/seo.ts#IS_STAGING)
#   - eigener Coolify-Webhook, damit die Live-App unberuehrt bleibt
#
# EINRICHTUNG (einmalig, ausserhalb dieses Repos):
#   1. Coolify: zweite Anwendung anlegen, Quelle ghcr.io/cibakhun/sc-patch-archive:staging,
#      eigene Domain (z. B. staging.verse-base.com).
#   2. Deren Deploy-Webhook als Secret COOLIFY_STAGING_WEBHOOK hinterlegen
#      (Umgebung `staging`, ersatzweise Repo-Secret), dazu COOLIFY_API_TOKEN
#      in derselben Umgebung. Ein Coolify-Token gilt fuer sein ganzes Team —
#      steht die Vorschau im selben Team wie die Live-App, reicht ihr Token
#      auch dorthin (siehe Kopf von deploy-image.yml).
#   3. Zweig anlegen und pushen: git switch -c staging && git push -u origin staging
#
# ABLAUF danach: PR -> in `staging` mergen -> ansehen -> in `main` mergen.
#
# Aufbau wie deploy-image.yml: build (ohne Rechte, build-site-image.yml) ->
# publish (frische Maschine, ID-Vergleich, Push) -> deploy (Umgebung
# `staging`, nur dort die Coolify-Secrets). Die Begruendung steht dort.
name: Build & Push Staging Image

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-image-build
  cancel-in-progress: true

jobs:
  # Erst BAUEN und pruefen, nicht pushen. Die Vorschau-Pruefungen (sperrende
  # robots.txt, noindex, Browser-Rauchtest mit frisch gewuerfeltem
  # Tor-Durchlass, check-gate gegen den laufenden Container) stehen samt
  # Begruendung in build-site-image.yml.
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-site-image.yml
    with:
      staging: true
      tags: |
        ghcr.io/cibakhun/sc-patch-archive:staging
        ghcr.io/cibakhun/sc-patch-archive:staging-${{ github.sha }}
      artifact: staging-image

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image-Artefakt holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-image
          path: ${{ runner.temp }}/image

      # Kein Checkout in diesem Job — Pruefung wie in deploy-image.yml.
      - name: Laden und mit dem gebauten Image vergleichen
        env:
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
          TAGS: |
            ghcr.io/cibakhun/sc-patch-archive:staging
            ghcr.io/cibakhun/sc-patch-archive:staging-${{ github.sha }}
        run: |
          zstd -d -q -c "$RUNNER_TEMP/image/image.tar.zst" | docker load
          mapfile -t ALL < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d;s/^[[:space:]]*//;s/[[:space:]]*$//')
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::Keine Image-ID vom Bau-Job erhalten ('$IMAGE_ID')."; exit 1 ;; esac
          for t in "${ALL[@]}"; do
            HAVE=$(docker image inspect --format '{{.Id}}' "$t")
            if [ "$HAVE" != "$IMAGE_ID" ]; then
              echo "::error::$t ist nicht das gepruefte Image ($HAVE statt $IMAGE_ID) — es wird nichts geschoben."; exit 1
            fi
            echo "OK $t = $IMAGE_ID"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (erst nach bestandenen Pruefungen)
        run: |
          docker push ghcr.io/cibakhun/sc-patch-archive:staging
          docker push ghcr.io/cibakhun/sc-patch-archive:staging-${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/coolify-deploy.sh
            scripts/check-deployed.mjs
            scripts/check-headers.mjs
            scripts/lib/csp-inline.mjs

      # Am 14.08.2026 scheiterte dieser Schritt zweimal mit 401, obwohl derselbe
      # Token, direkt von Hand aufgerufen, sauber "deployment queued" lieferte.
      # Ursache war nicht der Token, sondern sein TRANSPORT: ein an den Secret-Wert
      # geratenes Zeilenende macht den Bearer-Header ungueltig, und `curl -f`
      # verschluckt dabei auch noch den Rumpf, sodass im Log nur "error: 401" stand.
      # Daher trimmt coolify-deploy.sh Rand-Leerraum, gibt HTTP-Code und Antwort
      # aus und nennt die Laenge des Tokens (nicht seinen Wert) — daran ist ein
      # eingeschlepptes Zeilenende sofort zu erkennen. Fehlt ein Secret, wird
      # bewusst NICHT rot (ein Fork ohne Coolify soll bauen koennen), aber als
      # ::warning:: — am 14.08.2026 lief dieser Zweig zweimal unbemerkt durch
      # (das Secret war gesetzt, aber LEER), und der gruene Lauf sah aus wie ein
      # geglueckter Deploy.
      - name: Trigger Coolify redeploy (staging)
        env:
          HOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          LABEL: staging
          PIN_TAG: ${{ vars.COOLIFY_PIN_IMAGE_TAG == 'true' && format('staging-{0}', github.sha) || '' }}
        run: bash .github/scripts/coolify-deploy.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Nachsehen, ob die Vorschau den frisch gebauten Stand WIRKLICH
      # ausliefert. "Image gepusht" und "Coolify angestossen" sind keine
      # Antwort darauf: am 08.08.2026 lieferte staging knapp vier Stunden den
      # Vortagsstand aus, und an anderem Tag hing Coolify 20 Minuten.
      #
      # ⚠ GEMESSEN am 09.08.2026: Cloudflare weist den GitHub-Runner mit 403
      # ab — dieselbe Sperre gegen Rechenzentren wie bei UEX. Der Schritt
      # kann die Frage von hier aus also NICHT beantworten und bricht bei 403
      # sofort ab (statt sein Fenster auszusitzen); `--weich` haelt ihn dabei
      # gruen, weil "ich komme nicht hin" kein Befund ueber den Deploy ist.
      # Er bleibt trotzdem stehen: er kostet eine Sekunde, protokolliert den
      # Zustand, und wenn die Sperre je faellt, misst er wieder wirklich.
      # Die belastbare Antwort gibt `npm run check:staging` vom
      # Entwicklungsrechner aus — dort ist sie streng.
      - name: Warten, bis die Vorschau den neuen Stand zeigt
        run: |
          node scripts/check-deployed.mjs \
            --base https://staging.verse-base.com \
            --sha ${{ github.sha }} \
            --vorschau \
            --weich \
            --warte 600

      # Dieselben Kopfzeilen wie im Rauchtest, jetzt durch Cloudflare hindurch:
      # das sieht nur, wer die ausgelieferte Seite fragt. `--weich`, weil
      # Cloudflare den Runner meist abweist (siehe oben); was durchkommt, wird
      # streng beurteilt. Streng von Hand: node scripts/check-headers.mjs --base https://staging.verse-base.com
      - name: Kopfzeilen der Vorschau pruefen
        run: node scripts/check-headers.mjs --base https://staging.verse-base.com --weich
