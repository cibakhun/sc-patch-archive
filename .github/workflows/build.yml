# Build-Button — manuell am Patch-Day auslösen (Actions → Build → Run workflow).
# Zieht frische Daten-Snapshots (FleetYards-Specs, UEX-Preise, FleetYards-Extras),
# committet sie zurück auf main, baut die Seite und prüft die Integrität.
# Sync-Schritte sind non-fatal: fällt eine API aus, baut die Seite mit dem
# letzten guten Snapshot weiter (Architektur-Grundsatz "last-good snapshot").
# Der Deploy-Schritt folgt beim Live-Gang — Coolify (Hetzner) zieht dann
# einfach den aktualisierten main.
#
# Der Fahrzeug-Katalog (src/data/vehicles.json) ist SEIT 01.4-05 (D-16) NICHT
# mehr Teil dieses Arbeitsablaufs: er kommt aus der eigenen Data.p4k-
# Extraktion (scripts/datamine-vehicles.mjs) und kann in CI nicht erneuert
# werden — er braucht die lokale Data.p4k. Ein neuer Katalog entsteht nur
# noch lokal (`npm run datamine:loadouts && npm run datamine:vehicles`) und
# wird von Hand committet, wie die übrigen Datamine-Werkzeuge des Projekts.
#
# ZWEI JOBS (Befund Lieferkette): `sync` installiert Pakete und ruft fremde
# APIs ab — dort laeuft fremder Code, deshalb nur Leserecht und kein
# hinterlegtes Token. Er reicht die neuen Snapshots als Patch weiter.
# `commit` hat Schreibrecht, fuehrt keinen Paketcode aus, nimmt nur
# Aenderungen an den drei Snapshot-Dateien der Syncs an und committet erst,
# wenn der Bau mit den neuen Daten bestanden hat (vorher wurde auch ein Stand
# committet, an dem der Bau dann riss).
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-button
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync ship specs (FleetYards)
        run: npm run sync:ships
        continue-on-error: true

      - name: Sync in-game prices (UEX Corp)
        run: npm run sync:prices
        continue-on-error: true

      - name: Sync 3D/paints/variants (FleetYards)
        run: npm run sync:extras
        continue-on-error: true

      # Vor dem Bau festhalten: committet wird, was die Syncs geholt haben,
      # nicht was der Bau nebenher erzeugt.
      - name: Snapshot-Aenderungen als Patch sichern
        id: patch
        run: |
          # Gegen HEAD, nicht gegen den Index: `git add -N` traegt Loeschungen
          # sofort in den Index ein, ein Diff gegen ihn liesse sie aus.
          git add -N src/data
          git diff --binary HEAD -- src/data > "$RUNNER_TEMP/snapshots.patch"
          if [ -s "$RUNNER_TEMP/snapshots.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat HEAD -- src/data | tail -1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "snapshots unchanged"
          fi

      - name: Build
        run: npm run build

      - name: Verify integrity
        run: node scripts/_verify.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: snapshots-patch
          path: ${{ runner.temp }}/snapshots.patch
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 7

  commit:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots-patch
          path: ${{ runner.temp }}/patch

      # Der Patch kommt aus dem Job, in dem fremder Code lief. Angenommen
      # wird er nur, wenn er ausschliesslich die drei Dateien aendert, die
      # die Syncs schreiben, und sie gewoehnliche Dateien bleiben. Alles
      # andere unter src/data/ (z. B. .ts-Module, die beim Bau laufen, oder
      # der lokal erzeugte Fahrzeug-Katalog) kommt so nie hinein, ebenso
      # neue, geloeschte oder in Verweise verwandelte Dateien.
      - name: Patch pruefen und anwenden
        run: |
          git apply --index "$RUNNER_TEMP/patch/snapshots.patch"
          ERLAUBT='^src/data/(ships|vehicle-prices|ship-extras)\.json$'
          FREMD=$(git -c core.quotePath=false diff --cached --no-renames --name-only | grep -vE "$ERLAUBT" || true)
          NEU_WEG=$(git -c core.quotePath=false diff --cached --no-renames --name-only --diff-filter=ADT || true)
          MODUS=$(git diff --cached --raw --no-renames | awk '$1!=":100644" || $2!="100644"' || true)
          if [ -n "$FREMD$NEU_WEG$MODUS" ]; then
            echo "::error::Der Patch aendert mehr als die drei Snapshot-Dateien — nichts wird committet:"
            printf '%s\n' "$FREMD" "$NEU_WEG" "$MODUS"
            exit 1
          fi
          git diff --cached --stat | tail -1

      - name: Commit refreshed snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "build-button"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh snapshots (build button)"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:${GITHUB_REF}"
