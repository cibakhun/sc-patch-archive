# Build-Button — manuell am Patch-Day auslösen (Actions → Build → Run workflow).
# Zieht frische Daten-Snapshots (FleetYards-Specs, UEX-Preise, FleetYards-Extras),
# committet sie zurück auf main, baut die Seite und prüft die Integrität.
# Sync-Schritte sind non-fatal: fällt eine API aus, baut die Seite mit dem
# letzten guten Snapshot weiter (Architektur-Grundsatz "last-good snapshot").
# Der Deploy-Schritt folgt beim Live-Gang — Coolify (Hetzner) zieht dann
# einfach den aktualisierten main.
#
# Der Fahrzeug-Katalog (src/data/vehicles.json) ist SEIT 01.4-05 (D-16) NICHT
# mehr Teil dieses Arbeitsablaufs: er kommt aus der eigenen Data.p4k-
# Extraktion (scripts/datamine-vehicles.mjs) und kann in CI nicht erneuert
# werden — er braucht die lokale Data.p4k. Ein neuer Katalog entsteht nur
# noch lokal (`npm run datamine:loadouts && npm run datamine:vehicles`) und
# wird von Hand committet, wie die übrigen Datamine-Werkzeuge des Projekts.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-button
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync ship specs (FleetYards)
        run: npm run sync:ships
        continue-on-error: true

      - name: Sync in-game prices (UEX Corp)
        run: npm run sync:prices
        continue-on-error: true

      - name: Sync 3D/paints/variants (FleetYards)
        run: npm run sync:extras
        continue-on-error: true

      - name: Commit refreshed snapshots
        run: |
          git config user.name "build-button"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- src/data; then
            git add src/data
            git commit -m "data: refresh snapshots (build button)"
            git push
          else
            echo "snapshots unchanged"
          fi

      - name: Build
        run: npm run build

      - name: Verify integrity
        run: node scripts/_verify.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
