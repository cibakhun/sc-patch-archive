# Pruefung jedes Pull Requests gegen staging oder main — VOR dem Merge statt
# erst danach im Deploy. Derselbe Baustein wie die Deploys
# (build-site-image.yml): das Image wird gebaut, das Tor im Dockerfile
# laeuft, Indexierbarkeit und Browser-Rauchtest am fertigen Image. Es wird
# nichts hochgeladen und nichts veroeffentlicht.
#
# Absichtlich `pull_request` und NICHT `pull_request_target`: ein PR aus
# einem Fork laeuft so ohne Secrets und mit Leserecht. pull_request_target
# wuerde fremden Code mit den Rechten dieses Repos ausfuehren.
#
# Vorschau oder Live? PRs nach staging werden als Vorschau gebaut (Tor
# scharf, check-gate laeuft mit), PRs nach main als Live-Build.
name: PR-Pruefung

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    permissions:
      contents: read
    uses: ./.github/workflows/build-site-image.yml
    with:
      staging: ${{ github.base_ref == 'staging' }}
      tags: |
        sc-patch-archive:pr-${{ github.event.pull_request.number }}

  # Der Bot hat kein Tor im Seiten-Image; sein Selbsttest und die
  # Importprobe laufen im Bot-Dockerfile. Gebaut wird nur, nichts geschoben.
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bot-Image bauen (mit Selbsttest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: discord/bot/Dockerfile
          push: false
          provenance: false
          tags: verse-base-rank-bot:pr-${{ github.event.pull_request.number }}

  # Neue oder angehobene Abhaengigkeiten mit bekannter Luecke ab "high"
  # halten den PR auf.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Die Pruefung braucht den Abhaengigkeitsgraphen des Repos (Settings ->
      # Code security -> Dependency graph). Ist er aus, antwortet GitHub 403.
      # Das ist eine Einstellung, kein Befund am PR: dann WARNUNG statt rot.
      # Jede andere Antwort bleibt ein Fehler.
      - name: Abhaengigkeitsgraph verfuegbar?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if OUT=$(gh api "repos/$REPO/dependency-graph/compare/$BASE...$HEAD" 2>&1 >/dev/null); then
            echo "on=true" >> "$GITHUB_OUTPUT"
          elif [ "$OUT" = "gh: Forbidden (HTTP 403)" ]; then
            # Nur genau diese Antwort wird zur Warnung: so antwortet die API
            # mit dem Job-Token, solange der Graph aus ist (beobachtet am
            # 29.10.2026). Ratenlimit und fehlendes Recht bringen eigenen
            # Text mit ("rate limit", "Resource not accessible") und bleiben
            # Fehler, wie alles andere.
            echo "::warning::Abhaengigkeitsgraph nicht verfuegbar, die Abhaengigkeitspruefung entfaellt ($OUT). Einschalten: Settings -> Code security -> Dependency graph."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Abhaengigkeitsvergleich nicht abrufbar: $OUT"
            exit 1
          fi
      - if: steps.graph.outputs.on == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
